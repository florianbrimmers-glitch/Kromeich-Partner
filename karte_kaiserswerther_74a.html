<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gebäude – Kaiserswerther Str. 74a, Ratingen</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif}
  #map{height:100%}
  .legend{background:#fff;padding:10px 12px;line-height:1.5em;box-shadow:0 0 8px rgba(0,0,0,.3);border-radius:6px;font-size:13px}
  .legend i{width:14px;height:14px;display:inline-block;margin-right:6px;opacity:.8;vertical-align:middle;border:1px solid #555}
  .lbl{background:rgba(255,255,255,.85);border:1px solid #888;border-radius:3px;padding:1px 4px;font-size:11px;font-weight:bold;white-space:nowrap}
</style>
</head>
<body>
<div id="map"></div>
<script>
// Daten aus OpenStreetMap (ODbL). Flächen aus Geometrie berechnet.
// Kategorien: atu = Ausgangsgebäude, attached = baulich an 74a angebaut,
//             neighbor = eigenständiges Nachbargebäude.
var buildings = [
 {id:113488874,label:"Nr. 74",area:342,cat:"keep",geom:[[51.2988657,6.8339854],[51.2986319,6.8340756],[51.2986588,6.8342539],[51.2988926,6.8341637]]},
 {id:113488845,label:"nördl. ohne Adresse",area:1393,cat:"north",geom:[[51.2990396,6.8336724],[51.2990410,6.8336818],[51.2994417,6.8335328],[51.2993805,6.8331119],[51.2993373,6.8331279],[51.2993289,6.8330700],[51.2992095,6.8331144],[51.2992173,6.8331680],[51.2991186,6.8332047],[51.2990699,6.8332800],[51.2989870,6.8333108],[51.2989941,6.8333595]]},
 {id:113488836,label:"nördl. ohne Adresse",area:155,cat:"north",geom:[[51.2992259,6.8337019],[51.2990734,6.8337576],[51.2990913,6.8338825],[51.2992437,6.8338268]]},
 {id:113488854,label:"nördl. ohne Adresse",area:1419,cat:"north",geom:[[51.2993805,6.8331119],[51.2993643,6.8330069],[51.2995418,6.8329443],[51.2996841,6.8339334],[51.2995099,6.8339990],[51.2994417,6.8335328]]}
];

var colors = {keep:"#2ca02c", north:"#9467bd"};

// Amtliche ALKIS-Flurstücke (GEObasis NRW, WFS ALKIS vereinfacht, Stand 2024-11-25 / Dienst 2026)
var parcels = [
 {label:"Flur 17, Flst. 65", flaeche:"6615.0", geom:[[51.2994582, 6.8327411], [51.2994212, 6.8327916], [51.2993486, 6.8328908], [51.2992795, 6.8329851], [51.2991148, 6.83321], [51.2990628, 6.8332811], [51.2989866, 6.8333098], [51.2990224, 6.8335721], [51.2990356, 6.8336688], [51.2990358, 6.83367], [51.299046, 6.8337687], [51.2990567, 6.8337654], [51.299087, 6.8339721], [51.2991504, 6.8339504], [51.2991778, 6.8341213], [51.2994156, 6.8340322], [51.2995141, 6.8339953], [51.2996883, 6.8339301], [51.2997473, 6.833908], [51.2997835, 6.8338944], [51.2998951, 6.8338527], [51.2999759, 6.8338224], [51.300042, 6.8337976], [51.3000132, 6.8337129], [51.299879, 6.8334202], [51.2999274, 6.8334021], [51.2998996, 6.8333474], [51.2998135, 6.8331991], [51.2997182, 6.8330531], [51.2996288, 6.8329375], [51.2995438, 6.8328459], [51.2994582, 6.8327411]]},
 {label:"Flur 17, Flst. 64", flaeche:"933.0", geom:[[51.2988946, 6.833885], [51.2985445, 6.8340173], [51.2986069, 6.8343351], [51.2989819, 6.8341947], [51.2989697, 6.8341028], [51.2989283, 6.8341167], [51.2988946, 6.833885]]}
];

var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:20, attribution:'© OpenStreetMap-Mitwirkende (ODbL)'
}).addTo(map);

var group = L.featureGroup();

// Flurstücksgrenzen zuerst (liegen unter den Gebäuden)
parcels.forEach(function(p){
  var poly = L.polygon(p.geom,{color:"#000",weight:3,dashArray:"8 5",fill:true,fillColor:"#ffff00",fillOpacity:.12}).addTo(group);
  poly.bindPopup("<b>"+p.label+"</b><br>Gemarkung Ratingen<br>Amtliche Fläche: "+parseFloat(p.flaeche).toLocaleString('de-DE')+" m²<br><small>Quelle: ALKIS / GEObasis NRW</small>");
  poly.bindTooltip(p.label+"<br>"+parseFloat(p.flaeche).toLocaleString('de-DE')+" m²",{permanent:true,direction:"top",className:"lbl"});
});

buildings.forEach(function(b){
  var poly = L.polygon(b.geom,{color:colors[b.cat],weight:2,fillOpacity:.45}).addTo(group);
  poly.bindPopup("<b>"+b.label+"</b><br>OSM Way "+b.id+"<br>Grundfläche ≈ "+b.area+" m²");
  poly.bindTooltip(b.label+"<br>≈"+b.area+" m²",{permanent:true,direction:"center",className:"lbl"});
});
group.addTo(map);
map.fitBounds(group.getBounds().pad(0.15));

var legend = L.control({position:'bottomright'});
legend.onAdd = function(){
  var d = L.DomUtil.create('div','legend');
  d.innerHTML = '<b>Kaiserswerther Str. – Gelände</b><br>'+
    '<i style="background:'+colors.keep+'"></i> Gebäude Nr. 74<br>'+
    '<i style="background:'+colors.north+'"></i> nördl. Gebäude ohne Adresse<br>'+
    '<i style="background:#ffff00;border:2px dashed #000"></i> ALKIS-Flurstück (amtlich)<br>'+
    '<small>Gebäude: OpenStreetMap (ODbL), Fläche aus Geometrie ±5–10 %.<br>Flurstücke: GEObasis NRW / ALKIS (amtliche Fläche).</small>';
  return d;
};
legend.addTo(map);
</script>
</body>
</html>
