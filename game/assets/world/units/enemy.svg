<?xml version="1.0" encoding="UTF-8"?>
<!-- Gegner-Held-Icon. Aehnliches Silhouette wie Held, aber farbneutral
     (mostly Weiss/Hellgrau), damit das CityScreen/WorldMap es per
     `modulate` in Fraktions-Farben einfaerbt. Heller Sockel -> wird
     z.B. orange/rot/violett, je nach owner_id. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <ellipse cx="32" cy="58" rx="20" ry="4" fill="#000" opacity="0.45"/>
  <!-- Sockel-Disc: weiss damit tint sauber durchschlaegt -->
  <ellipse cx="32" cy="54" rx="22" ry="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <ellipse cx="32" cy="52" rx="20" ry="6" fill="#f0f0f0"/>
  <!-- Beine -->
  <rect x="26" y="40" width="5" height="14" fill="#dcdcdc" stroke="#1a1a1a" stroke-width="0.5"/>
  <rect x="33" y="40" width="5" height="14" fill="#dcdcdc" stroke="#1a1a1a" stroke-width="0.5"/>
  <!-- Stiefel -->
  <ellipse cx="28.5" cy="53" rx="3.5" ry="2" fill="#3a3a3a"/>
  <ellipse cx="35.5" cy="53" rx="3.5" ry="2" fill="#3a3a3a"/>
  <!-- Koerper -->
  <polygon points="22,40 42,40 44,24 20,24" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Schulterplatten -->
  <ellipse cx="22" cy="25" rx="4" ry="3.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="0.8"/>
  <ellipse cx="42" cy="25" rx="4" ry="3.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="0.8"/>
  <!-- Wappenrock - Mittelfarbe, damit modulate sich aufpraegt -->
  <polygon points="26,28 38,28 36,38 28,38" fill="#bcbcbc"/>
  <!-- Kopf -->
  <ellipse cx="32" cy="18" rx="6.5" ry="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="28" y="17" width="8" height="2" fill="#1a1a1a"/>
  <!-- Helmkamm -->
  <polygon points="32,12 36,4 38,12" fill="#cccccc" stroke="#1a1a1a" stroke-width="0.5"/>
  <!-- Waffe (Axt / Streitkolben, generisch) -->
  <rect x="44" y="14" width="4" height="22" fill="#aaaaaa" stroke="#1a1a1a" stroke-width="0.6"/>
  <polygon points="40,14 52,14 50,8 42,8" fill="#888888" stroke="#1a1a1a" stroke-width="0.6"/>
  <!-- Schild -->
  <path d="M 18 28 Q 12 28 12 34 L 12 38 Q 12 44 18 44 L 18 44 Q 24 44 24 38 L 24 32 Q 24 28 18 28 Z"
        fill="#dddddd" stroke="#1a1a1a" stroke-width="1"/>
</svg>
