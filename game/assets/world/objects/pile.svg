<!-- Ressourcen-Haufen (M3). Bewusst hell/neutral gehalten, damit der
     WorldMap-Renderer ihn per Modulate in der Ressourcen-Farbe toenen
     kann (RESOURCE_COLORS in WorldMapScreen). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <ellipse cx="32" cy="56" rx="22" ry="4" fill="#000" opacity="0.4"/>
  <!-- Haufen aus Brocken, hell fuer sauberes Tinting -->
  <ellipse cx="32" cy="48" rx="22" ry="10" fill="#c8c8c8" stroke="#3a3a3a" stroke-width="1.5"/>
  <polygon points="14,46 24,34 34,44 28,50 18,50" fill="#e0e0e0" stroke="#3a3a3a" stroke-width="1.2"/>
  <polygon points="30,44 40,30 50,44 44,50 34,50" fill="#d4d4d4" stroke="#3a3a3a" stroke-width="1.2"/>
  <polygon points="24,38 32,26 42,38 36,44 28,44" fill="#efefef" stroke="#3a3a3a" stroke-width="1.2"/>
  <!-- Highlights -->
  <polygon points="28,32 32,28 36,32 32,35" fill="#ffffff" opacity="0.7"/>
  <polygon points="20,42 24,38 28,42 24,45" fill="#ffffff" opacity="0.5"/>
</svg>
