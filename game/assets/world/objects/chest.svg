<?xml version="1.0" encoding="UTF-8"?>
<!-- Schatzkiste. Holzgebogenes Deckel, Messing-Beschlaege, Goldmuenze. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ch_wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87238"/>
      <stop offset="1" stop-color="#5c3c18"/>
    </linearGradient>
    <linearGradient id="ch_lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#caa472"/>
      <stop offset="1" stop-color="#7c5a30"/>
    </linearGradient>
  </defs>
  <ellipse cx="32" cy="58" rx="22" ry="3.5" fill="#000" opacity="0.45"/>
  <!-- Truhen-Koerper (unten, rechteckig) -->
  <rect x="10" y="32" width="44" height="22" fill="url(#ch_wood)" stroke="#2a1a08" stroke-width="1.5"/>
  <line x1="10" y1="44" x2="54" y2="44" stroke="#3a2412" stroke-width="0.8" opacity="0.6"/>
  <!-- Deckel (gebogen oben) -->
  <path d="M 10 32 Q 10 18 32 18 Q 54 18 54 32 Z" fill="url(#ch_lid)" stroke="#2a1a08" stroke-width="1.5"/>
  <path d="M 14 30 Q 14 22 32 22 Q 50 22 50 30" stroke="#3a2412" stroke-width="0.8"
        fill="none" opacity="0.5"/>
  <!-- Messing-Beschlaege -->
  <rect x="10" y="30" width="44" height="3" fill="#e6c247" stroke="#7a5a18" stroke-width="0.8"/>
  <rect x="14" y="18" width="4" height="36" fill="#e6c247" stroke="#7a5a18" stroke-width="0.8"/>
  <rect x="46" y="18" width="4" height="36" fill="#e6c247" stroke="#7a5a18" stroke-width="0.8"/>
  <!-- Schloss in der Mitte -->
  <rect x="28" y="32" width="8" height="10" fill="#e6c247" stroke="#7a5a18" stroke-width="0.8"/>
  <circle cx="32" cy="36" r="1.6" fill="#3a2c10"/>
  <!-- Goldmuenze oben drauf als "Inhalt-Andeutung" -->
  <circle cx="32" cy="14" r="3.5" fill="#f4dc7c" stroke="#7a5a18" stroke-width="0.8"/>
  <circle cx="32" cy="14" r="2"   fill="#e6c247"/>
  <text x="32" y="16" font-family="serif" font-size="4" font-weight="bold"
        text-anchor="middle" fill="#7a5a18">G</text>
</svg>
