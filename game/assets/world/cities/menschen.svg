<?xml version="1.0" encoding="UTF-8"?>
<!-- Stadt-Icon Menschen. Stein-Burg, Zinnen, rotes Banner. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cm_stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#caab7e"/>
      <stop offset="1" stop-color="#7c6044"/>
    </linearGradient>
  </defs>
  <ellipse cx="32" cy="56" rx="22" ry="4" fill="#000" opacity="0.45"/>
  <!-- Main fort body -->
  <rect x="10" y="26" width="44" height="28" fill="url(#cm_stone)" stroke="#3a2c1a" stroke-width="1.5"/>
  <!-- Crenellations (Zinnen) along the top of main wall -->
  <g fill="url(#cm_stone)" stroke="#3a2c1a" stroke-width="1">
    <rect x="10" y="22" width="6" height="6"/>
    <rect x="20" y="22" width="6" height="6"/>
    <rect x="30" y="22" width="6" height="6"/>
    <rect x="40" y="22" width="6" height="6"/>
    <rect x="48" y="22" width="6" height="6"/>
  </g>
  <!-- Tor in der Mitte -->
  <path d="M 26 54 L 26 40 Q 26 34 32 34 Q 38 34 38 40 L 38 54 Z" fill="#2a1a0a"/>
  <!-- Linker Turm -->
  <rect x="4" y="14" width="14" height="40" fill="url(#cm_stone)" stroke="#3a2c1a" stroke-width="1.5"/>
  <g fill="url(#cm_stone)" stroke="#3a2c1a" stroke-width="1">
    <rect x="4"  y="10" width="4" height="4"/>
    <rect x="10" y="10" width="4" height="4"/>
  </g>
  <!-- Rechter Turm -->
  <rect x="46" y="14" width="14" height="40" fill="url(#cm_stone)" stroke="#3a2c1a" stroke-width="1.5"/>
  <g fill="url(#cm_stone)" stroke="#3a2c1a" stroke-width="1">
    <rect x="46" y="10" width="4" height="4"/>
    <rect x="52" y="10" width="4" height="4"/>
  </g>
  <!-- Fenster -->
  <rect x="8"  y="32" width="6" height="6" fill="#1a1006"/>
  <rect x="50" y="32" width="6" height="6" fill="#1a1006"/>
  <!-- Banner ueber dem Tor -->
  <line x1="32" y1="22" x2="32" y2="8" stroke="#3a2c1a" stroke-width="1.5"/>
  <polygon points="32,8 44,12 32,18" fill="#c93a2c" stroke="#5a1410" stroke-width="0.8"/>
</svg>
