<?xml version="1.0" encoding="UTF-8"?>
<!-- Stadt-Icon Totenreich. Knochenturm mit violettem Banner, Schaedel. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ct_bone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8c2b0"/>
      <stop offset="1" stop-color="#7a7466"/>
    </linearGradient>
  </defs>
  <ellipse cx="32" cy="56" rx="22" ry="4" fill="#000" opacity="0.55"/>
  <!-- Hauptturm: gotisch schmal und hoch -->
  <polygon points="20,54 44,54 42,18 22,18" fill="url(#ct_bone)" stroke="#3a3628" stroke-width="1.5"/>
  <!-- Spitze -->
  <polygon points="22,18 42,18 32,4" fill="#5a4e3c" stroke="#2a221a" stroke-width="1"/>
  <!-- Spitze-Schmuck (Stern/Kreuz) -->
  <line x1="32" y1="0" x2="32" y2="4" stroke="#2a221a" stroke-width="1.5"/>
  <circle cx="32" cy="0" r="1.5" fill="#9a3a8a"/>
  <!-- Fenster (gotische Bogen, violett glow) -->
  <path d="M 28 32 L 28 26 Q 28 22 30 22 L 34 22 Q 36 22 36 26 L 36 32 Z" fill="#5a2a6a"/>
  <path d="M 26 46 L 26 40 Q 26 36 28 36 L 30 36 Q 32 36 32 40 L 32 46 Z" fill="#5a2a6a"/>
  <path d="M 32 46 L 32 40 Q 32 36 34 36 L 36 36 Q 38 36 38 40 L 38 46 Z" fill="#5a2a6a"/>
  <!-- Seitliche Tuermchen -->
  <polygon points="10,54 18,54 17,26 11,26" fill="url(#ct_bone)" stroke="#3a3628" stroke-width="1"/>
  <polygon points="11,26 17,26 14,18" fill="#5a4e3c" stroke="#2a221a" stroke-width="0.8"/>
  <polygon points="46,54 54,54 53,26 47,26" fill="url(#ct_bone)" stroke="#3a3628" stroke-width="1"/>
  <polygon points="47,26 53,26 50,18" fill="#5a4e3c" stroke="#2a221a" stroke-width="0.8"/>
  <!-- Banner violett -->
  <line x1="32" y1="18" x2="32" y2="14" stroke="#2a221a" stroke-width="1"/>
  <polygon points="32,14 42,16 32,20" fill="#7a2a6a" stroke="#3a103a" stroke-width="0.5"/>
  <!-- Schaedel-Symbol an der Wand -->
  <ellipse cx="32" cy="48" rx="3" ry="3" fill="#e6dec8"/>
  <circle cx="30.5" cy="47.5" r="0.8" fill="#1a1408"/>
  <circle cx="33.5" cy="47.5" r="0.8" fill="#1a1408"/>
</svg>
