<?xml version="1.0" encoding="UTF-8"?>
<!-- Stadt-Icon Waldvolk. Grosser Baum mit Holzpalisade, gruener Akzent. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="cw_leaf" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0"   stop-color="#5e9a3a"/>
      <stop offset="0.6" stop-color="#3e7a26"/>
      <stop offset="1"   stop-color="#244818"/>
    </radialGradient>
  </defs>
  <ellipse cx="32" cy="56" rx="22" ry="4" fill="#000" opacity="0.45"/>
  <!-- Baumstamm -->
  <polygon points="26,46 38,46 38,28 26,28" fill="#6c4824" stroke="#2a1a08" stroke-width="1"/>
  <line x1="30" y1="32" x2="30" y2="44" stroke="#3a2614" stroke-width="0.8" opacity="0.6"/>
  <line x1="34" y1="32" x2="34" y2="44" stroke="#3a2614" stroke-width="0.8" opacity="0.6"/>
  <!-- Riesige Baumkrone -->
  <ellipse cx="32" cy="22" rx="22" ry="20" fill="url(#cw_leaf)" stroke="#1c3010" stroke-width="1"/>
  <ellipse cx="22" cy="20" rx="9"  ry="7"  fill="#74a448" opacity="0.85"/>
  <ellipse cx="42" cy="18" rx="7"  ry="6"  fill="#74a448" opacity="0.8"/>
  <ellipse cx="34" cy="10" rx="6"  ry="5"  fill="#84b258" opacity="0.85"/>
  <!-- Holz-Palisade unten -->
  <g fill="#7a5a30" stroke="#3a2614" stroke-width="0.8">
    <polygon points="4,54 4,42 8,38 8,54"/>
    <polygon points="8,54 8,40 12,36 12,54"/>
    <polygon points="12,54 12,42 16,38 16,54"/>
    <polygon points="16,54 16,40 20,36 20,54"/>
    <polygon points="44,54 44,40 48,36 48,54"/>
    <polygon points="48,54 48,42 52,38 52,54"/>
    <polygon points="52,54 52,40 56,36 56,54"/>
    <polygon points="56,54 56,42 60,38 60,54"/>
  </g>
  <!-- Tor zwischen Baumstamm und Palisade -->
  <rect x="22" y="46" width="20" height="8" fill="#2a1a08"/>
</svg>
