<?xml version="1.0" encoding="UTF-8"?>
<!-- Terrain-Tile Gras. 64x64, kachelt seitlich akzeptabel (Farbe gleich
     am Rand). Sanfte Tufts und Blueten als Belebung. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g_base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a8c3a"/>
      <stop offset="1" stop-color="#3e6c20"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" fill="url(#g_base)"/>
  <!-- Helle Lichtflecken (Bresenham-ish) -->
  <ellipse cx="18" cy="22" rx="10" ry="4" fill="#6e9a48" opacity="0.55"/>
  <ellipse cx="48" cy="44" rx="9"  ry="3" fill="#6e9a48" opacity="0.45"/>
  <!-- Grasbueschel -->
  <g stroke="#7eac56" stroke-width="1.2" stroke-linecap="round" opacity="0.7">
    <line x1="10" y1="32" x2="12" y2="28"/>
    <line x1="12" y1="32" x2="14" y2="29"/>
    <line x1="14" y1="32" x2="13" y2="28"/>
    <line x1="38" y1="18" x2="40" y2="14"/>
    <line x1="40" y1="18" x2="42" y2="15"/>
    <line x1="42" y1="18" x2="41" y2="14"/>
    <line x1="26" y1="50" x2="28" y2="46"/>
    <line x1="28" y1="50" x2="30" y2="47"/>
    <line x1="30" y1="50" x2="29" y2="46"/>
  </g>
  <!-- Mini-Bluete -->
  <circle cx="52" cy="20" r="1.6" fill="#f0d048"/>
  <circle cx="50" cy="20" r="1.2" fill="#f0d048"/>
  <circle cx="54" cy="20" r="1.2" fill="#f0d048"/>
  <circle cx="52" cy="18" r="1.2" fill="#f0d048"/>
  <circle cx="52" cy="22" r="1.2" fill="#f0d048"/>
  <circle cx="52" cy="20" r="0.8" fill="#c93a2c"/>
</svg>
