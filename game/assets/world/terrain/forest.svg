<?xml version="1.0" encoding="UTF-8"?>
<!-- Terrain-Tile Wald. Dichter Baum-Cluster, Boden in Gras-Farbe damit's
     bei Uebergaengen Sinn ergibt. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="f_base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a5a26"/>
      <stop offset="1" stop-color="#243818"/>
    </linearGradient>
    <radialGradient id="f_tree" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0"   stop-color="#4a6e2a"/>
      <stop offset="0.6" stop-color="#324a1c"/>
      <stop offset="1"   stop-color="#1c2c10"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" fill="url(#f_base)"/>
  <!-- Drei Baumkronen, ueberlappend -->
  <ellipse cx="18" cy="22" rx="14" ry="13" fill="url(#f_tree)"/>
  <ellipse cx="40" cy="18" rx="13" ry="12" fill="url(#f_tree)"/>
  <ellipse cx="48" cy="42" rx="15" ry="14" fill="url(#f_tree)"/>
  <ellipse cx="24" cy="46" rx="13" ry="12" fill="url(#f_tree)"/>
  <!-- Highlights oben links -->
  <ellipse cx="12" cy="18" rx="4"  ry="3" fill="#6a9038" opacity="0.6"/>
  <ellipse cx="36" cy="14" rx="4"  ry="3" fill="#6a9038" opacity="0.55"/>
  <ellipse cx="42" cy="38" rx="5"  ry="3" fill="#6a9038" opacity="0.55"/>
  <ellipse cx="18" cy="42" rx="4"  ry="3" fill="#6a9038" opacity="0.55"/>
</svg>
