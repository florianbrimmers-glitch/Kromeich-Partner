<?xml version="1.0" encoding="UTF-8"?>
<!-- Terrain-Tile Sand/Strand. Heller Beigeton mit Duenen-Wellen. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="s_base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6cf8e"/>
      <stop offset="1" stop-color="#c4a868"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" fill="url(#s_base)"/>
  <!-- Helle Sand-Wellen -->
  <g stroke="#f0dca0" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.65">
    <path d="M 6 18 Q 16 14, 26 18 T 46 18"/>
    <path d="M 22 36 Q 32 32, 42 36 T 58 36"/>
    <path d="M 10 52 Q 20 48, 30 52 T 50 52"/>
  </g>
  <!-- Schatten-Wellen -->
  <g stroke="#a8884c" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.45">
    <path d="M 6 22 Q 16 20, 26 22"/>
    <path d="M 22 40 Q 32 38, 42 40"/>
    <path d="M 10 56 Q 20 54, 30 56"/>
  </g>
  <!-- Steinchen -->
  <circle cx="44" cy="26" r="1.4" fill="#8a6e3a"/>
  <circle cx="14" cy="44" r="1.2" fill="#8a6e3a"/>
  <circle cx="54" cy="48" r="1.4" fill="#8a6e3a"/>
</svg>
