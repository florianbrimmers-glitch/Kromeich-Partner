<?xml version="1.0" encoding="UTF-8"?>
<!-- Terrain-Tile Wasser. Sanfter Blauverlauf mit Wellenstreifen. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="w_base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b6eaa"/>
      <stop offset="1" stop-color="#1c4a82"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" fill="url(#w_base)"/>
  <!-- Hellere Reflexe -->
  <ellipse cx="14" cy="20" rx="8" ry="2.5" fill="#7aaad8" opacity="0.55"/>
  <ellipse cx="44" cy="34" rx="7" ry="2.5" fill="#7aaad8" opacity="0.5"/>
  <ellipse cx="22" cy="48" rx="10" ry="2.5" fill="#7aaad8" opacity="0.45"/>
  <!-- Wellenstrich-Linien -->
  <g stroke="#aaccea" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M 4 28 Q 12 26, 20 28 T 36 28"/>
    <path d="M 30 18 Q 38 16, 46 18 T 60 18"/>
    <path d="M 6 56 Q 14 54, 22 56 T 38 56"/>
    <path d="M 38 44 Q 46 42, 54 44"/>
