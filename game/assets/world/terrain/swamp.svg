<?xml version="1.0" encoding="UTF-8"?>
<!-- Terrain-Tile Sumpf. Muffiger gruen-brauner Untergrund mit Schlammtuempeln
     und ein paar duerren Halmen. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sw_base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#566338"/>
      <stop offset="1" stop-color="#3a4624"/>
    </linearGradient>
    <radialGradient id="sw_pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#5e6448"/>
      <stop offset="0.7" stop-color="#3a4032"/>
      <stop offset="1"   stop-color="#2a3020"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" fill="url(#sw_base)"/>
  <!-- Schlamm-Tuempel -->
  <ellipse cx="20" cy="24" rx="14" ry="9"  fill="url(#sw_pool)"/>
  <ellipse cx="46" cy="42" rx="12" ry="8"  fill="url(#sw_pool)"/>
  <!-- Reflex-Highlights auf den Tuempeln -->
  <ellipse cx="16" cy="22" rx="4" ry="1.2" fill="#9aa886" opacity="0.65"/>
  <ellipse cx="44" cy="40" rx="4" ry="1.2" fill="#9aa886" opacity="0.6"/>
  <!-- Duerre Halme -->
  <g stroke="#6a5e2a" stroke-width="1.2" stroke-linecap="round" opacity="0.85">
    <line x1="38" y1="14" x2="36" y2="22"/>
    <line x1="40" y1="14" x2="42" y2="22"/>
    <line x1="42" y1="14" x2="40" y2="22"/>
    <line x1="10" y1="48" x2="12" y2="56"/>
    <line x1="12" y1="48" x2="10" y2="56"/>
    <line x1="14" y1="48" x2="14" y2="56"/>
    <line x1="56" y1="20" x2="54" y2="28"/>
    <line x1="58" y1="20" x2="60" y2="28"/>
  </g>
</svg>
