<?xml version="1.0" encoding="UTF-8"?>
<!-- Stadt-Hintergrund Menschen, Iteration 3 (Travian-Stil).
     Ovaler Stadtinnenraum mit Steinmauer, Eingangstor unten, Plaza
     im Zentrum, Sandwege strahlenfoermig zu jedem Gebaeude-Hotspot.
     Drumherum: Wiese, Baeume, Hintergrund-Berge.
     ViewBox: 1080x1600 (Stage-Aspect).
     Gebaeude-Hotspots (data/city_layout.json) liegen innerhalb der Mauer. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1600">
  <defs>
    <linearGradient id="bg_sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#3a567c"/>
      <stop offset="0.5"  stop-color="#7a98b8"/>
      <stop offset="1"    stop-color="#c8b890"/>
    </linearGradient>
    <radialGradient id="bg_sun_glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#fff4cc" stop-opacity="0.65"/>
      <stop offset="0.5" stop-color="#f8d068" stop-opacity="0.22"/>
      <stop offset="1"   stop-color="#f8d068" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg_far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e7c8c"/>
      <stop offset="1" stop-color="#5a6878"/>
    </linearGradient>
    <linearGradient id="bg_outer_grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a8a44"/>
      <stop offset="1" stop-color="#3e5824"/>
    </linearGradient>
    <radialGradient id="bg_inner_grass" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#8aa452"/>
      <stop offset="1" stop-color="#5e7a38"/>
    </radialGradient>
    <linearGradient id="bg_wall_stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8988a"/>
      <stop offset="1" stop-color="#6c5e50"/>
    </linearGradient>
    <radialGradient id="bg_plaza" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d8c8a0"/>
      <stop offset="1" stop-color="#a89272"/>
    </radialGradient>
    <radialGradient id="bg_vignette" cx="0.5" cy="0.55" r="0.75">
      <stop offset="0.7" stop-color="#000" stop-opacity="0"/>
      <stop offset="1"   stop-color="#000" stop-opacity="0.4"/>
    </radialGradient>
  </defs>

  <!-- Himmel (kleinerer Streifen, jetzt nur oberer Bereich) -->
  <rect x="0" y="0" width="1080" height="540" fill="url(#bg_sky)"/>
  <!-- Sonne oben-links -->
  <circle cx="170" cy="170" r="170" fill="url(#bg_sun_glow)"/>
  <circle cx="170" cy="170" r="42"  fill="#f4d674" opacity="0.78"/>
  <circle cx="170" cy="170" r="28"  fill="#fff4cc"/>
  <!-- Wolken -->
  <ellipse cx="420" cy="220" rx="100" ry="18" fill="#fff" opacity="0.30"/>
  <ellipse cx="460" cy="210" rx="60"  ry="12" fill="#fff" opacity="0.32"/>
  <ellipse cx="820" cy="280" rx="120" ry="22" fill="#fff" opacity="0.22"/>
  <ellipse cx="850" cy="270" rx="70"  ry="14" fill="#fff" opacity="0.24"/>

  <!-- Fernberge (dezent, halbverdeckt vom Aussenland) -->
  <path d="M -20 510 L 80 420 L 200 480 L 340 400 L 480 470 L 620 410 L 760 480 L 900 420 L 1080 480 L 1100 540 L -20 540 Z"
        fill="url(#bg_far)" opacity="0.9"/>

  <!-- Aussen-Land: Wiese rundum -->
  <rect x="0" y="500" width="1080" height="1100" fill="url(#bg_outer_grass)"/>

  <!-- Sand/Erde-Streifen am Aussenrand der Stadt (Andeutung Wegkreuzung) -->
  <ellipse cx="540" cy="920" rx="500" ry="420" fill="#7a6644" opacity="0.55"/>

  <!-- Baeume aussen, locker verteilt rund um die Stadt -->
  <g opacity="0.95">
    <!-- Hinten links -->
    <ellipse cx="68"  cy="640" rx="30" ry="42" fill="#324624"/>
    <rect    x="62"   y="660"  width="12" height="40" fill="#4a3220"/>
    <ellipse cx="44"  cy="624" rx="22" ry="30" fill="#3a5028"/>
    <!-- Hinten rechts -->
    <ellipse cx="1014" cy="660" rx="32" ry="44" fill="#324624"/>
    <rect    x="1008" y="678"  width="12" height="42" fill="#4a3220"/>
    <ellipse cx="1036" cy="640" rx="22" ry="32" fill="#3a5028"/>
    <ellipse cx="996"  cy="688" rx="20" ry="28" fill="#324624"/>
    <!-- Links mitte -->
    <ellipse cx="42"   cy="980"  rx="28" ry="40" fill="#324624"/>
    <rect    x="36"    y="998"   width="12" height="40" fill="#4a3220"/>
    <ellipse cx="38"   cy="1280" rx="32" ry="44" fill="#324624"/>
    <rect    x="32"    y="1298"  width="12" height="42" fill="#4a3220"/>
    <ellipse cx="60"   cy="1258" rx="24" ry="32" fill="#3a5028"/>
    <!-- Rechts mitte -->
    <ellipse cx="1042" cy="1000" rx="30" ry="42" fill="#324624"/>
    <rect    x="1036"  y="1020"  width="12" height="40" fill="#4a3220"/>
    <ellipse cx="1024" cy="1300" rx="34" ry="46" fill="#324624"/>
    <rect    x="1018"  y="1318"  width="12" height="44" fill="#4a3220"/>
    <ellipse cx="1046" cy="1278" rx="24" ry="32" fill="#3a5028"/>
    <!-- Vorn -->
    <ellipse cx="80"   cy="1480" rx="34" ry="48" fill="#2c3c20"/>
    <rect    x="74"    y="1500"  width="14" height="50" fill="#4a3220"/>
    <ellipse cx="1000" cy="1500" rx="36" ry="50" fill="#2c3c20"/>
    <rect    x="994"   y="1522"  width="14" height="50" fill="#4a3220"/>
  </g>

  <!-- STADTMAUER: ovale Doppellinie. Aussen-Stein, innen heller. -->
  <ellipse cx="540" cy="920" rx="480" ry="380" fill="none"
           stroke="#3a2e22" stroke-width="6"/>
  <ellipse cx="540" cy="920" rx="470" ry="370" fill="url(#bg_wall_stone)"
           stroke="none"/>
  <ellipse cx="540" cy="920" rx="440" ry="350" fill="#3a2e22"/>
  <!-- Innere Mauer-Schwelle (heller Stein-Streifen) -->
  <ellipse cx="540" cy="920" rx="436" ry="346" fill="url(#bg_inner_grass)"/>
  <!-- Mauer-Zinnen: Andeutung als Strich-Cluster am Aussenrand -->
  <g stroke="#3a2e22" stroke-width="2.5" opacity="0.7">
    <line x1="60"   y1="900"  x2="60"   y2="884"/>
    <line x1="120"  y1="700"  x2="124"  y2="684"/>
    <line x1="240"  y1="580"  x2="248"  y2="568"/>
    <line x1="420"  y1="528"  x2="424"  y2="514"/>
    <line x1="540"  y1="522"  x2="540"  y2="506"/>
    <line x1="660"  y1="528"  x2="660"  y2="514"/>
    <line x1="840"  y1="580"  x2="836"  y2="568"/>
    <line x1="960"  y1="700"  x2="956"  y2="684"/>
    <line x1="1020" y1="900"  x2="1020" y2="884"/>
    <line x1="960"  y1="1140" x2="956"  y2="1126"/>
    <line x1="120"  y1="1140" x2="124"  y2="1126"/>
  </g>

  <!-- TOR: Unterbrechung der Mauer in der Mitte unten + Holzbrücke -->
  <!-- Aussparung im Stein-Ring (uebermalen mit Wiese) -->
  <path d="M 460 1296 Q 540 1306 620 1296 L 620 1330 Q 540 1340 460 1330 Z"
        fill="url(#bg_outer_grass)"/>
  <!-- Holzplanken-Brueckchen vom Tor nach drausssen -->
  <polygon points="476,1296 604,1296 614,1380 466,1380" fill="#8a5e2c" stroke="#3a2412" stroke-width="2"/>
  <line x1="478"  y1="1316" x2="610"  y2="1316" stroke="#3a2412" stroke-width="1.4" opacity="0.6"/>
  <line x1="478"  y1="1336" x2="610"  y2="1336" stroke="#3a2412" stroke-width="1.4" opacity="0.6"/>
  <line x1="478"  y1="1356" x2="610"  y2="1356" stroke="#3a2412" stroke-width="1.4" opacity="0.6"/>
  <!-- Tor-Pfosten links/rechts -->
  <polygon points="448,1296 466,1300 466,1180 448,1176" fill="#5a3a18" stroke="#2a1a08" stroke-width="2"/>
  <polygon points="614,1300 632,1296 632,1176 614,1180" fill="#5a3a18" stroke="#2a1a08" stroke-width="2"/>
  <!-- Tor-Querbalken oben -->
  <polygon points="448,1180 632,1176 632,1162 448,1166" fill="#5a3a18" stroke="#2a1a08" stroke-width="2"/>
  <!-- Tor-Banner -->
  <polygon points="528,1162 552,1162 552,1196 540,1206 528,1196" fill="#c93a2c" stroke="#5a1410" stroke-width="1.5"/>

  <!-- PLAZA in der Mitte: heller Stein-Kreis -->
  <ellipse cx="540" cy="920" rx="86" ry="44" fill="url(#bg_plaza)" stroke="#7a644a" stroke-width="2"/>
  <!-- Brunnen-Andeutung in der Plaza-Mitte -->
  <ellipse cx="540" cy="920" rx="22" ry="12" fill="#445c66" stroke="#2a3a40" stroke-width="2"/>
  <ellipse cx="540" cy="918" rx="22" ry="10" fill="#6a8a98"/>
  <ellipse cx="540" cy="916" rx="14" ry="6"  fill="#88a8b6"/>
  <!-- Brunnen-Mauer Rand -->
  <ellipse cx="540" cy="922" rx="22" ry="6"  fill="#7a644a"/>

  <!-- WEGE: sandige Pfade von Plaza zu den 7 Gebaeude-Slots.
       Hotspots (siehe city_layout.json):
         kapelle  (0.50, 0.34) = (540, 544)
         schmiede (0.27, 0.46) = (292, 736)
         reiterei (0.73, 0.46) = (788, 736)
         markt    (0.18, 0.62) = (194, 992)
         wachturm (0.82, 0.62) = (886, 992)
         kaserne  (0.34, 0.76) = (367, 1216)
         spaeher  (0.66, 0.76) = (713, 1216) -->
  <g stroke="#b8a070" stroke-width="34" stroke-linecap="round" opacity="0.9" fill="none">
    <line x1="540" y1="920" x2="540" y2="600"/>
    <line x1="540" y1="920" x2="320" y2="780"/>
    <line x1="540" y1="920" x2="760" y2="780"/>
    <line x1="540" y1="920" x2="240" y2="980"/>
    <line x1="540" y1="920" x2="840" y2="980"/>
    <line x1="540" y1="920" x2="400" y2="1180"/>
    <line x1="540" y1="920" x2="680" y2="1180"/>
  </g>
  <!-- Weg vom Tor zum Plaza -->
  <line x1="540" y1="920" x2="540" y2="1296" stroke="#b8a070" stroke-width="42"
        stroke-linecap="round" opacity="0.9"/>
  <!-- Plaza-Umrandung erneut darueber (damit Pfade nicht in den Brunnen laufen) -->
  <ellipse cx="540" cy="920" rx="86" ry="44" fill="url(#bg_plaza)" stroke="#7a644a" stroke-width="2"/>
  <ellipse cx="540" cy="920" rx="22" ry="12" fill="#445c66" stroke="#2a3a40" stroke-width="2"/>
  <ellipse cx="540" cy="918" rx="22" ry="10" fill="#6a8a98"/>
  <ellipse cx="540" cy="916" rx="14" ry="6"  fill="#88a8b6"/>
  <ellipse cx="540" cy="922" rx="22" ry="6"  fill="#7a644a"/>

  <!-- Kleine Grueninseln zwischen den Wegen, damit's nicht so kahl wirkt -->
  <g opacity="0.85">
    <ellipse cx="420" cy="700"  rx="18" ry="9"  fill="#5e7a38"/>
    <ellipse cx="670" cy="700"  rx="18" ry="9"  fill="#5e7a38"/>
    <ellipse cx="380" cy="980"  rx="22" ry="11" fill="#5e7a38"/>
    <ellipse cx="700" cy="980"  rx="22" ry="11" fill="#5e7a38"/>
    <ellipse cx="430" cy="1130" rx="14" ry="7"  fill="#5e7a38"/>
    <ellipse cx="640" cy="1130" rx="14" ry="7"  fill="#5e7a38"/>
    <!-- Mini-Baeume innen, dezent -->
    <ellipse cx="420" cy="690"  rx="12" ry="16" fill="#324624"/>
    <ellipse cx="670" cy="690"  rx="12" ry="16" fill="#324624"/>
  </g>

  <!-- Schatten-Vignette: weniger stark als vorher, damit der innenraum
       hell und einladend wirkt -->
  <rect x="0" y="0" width="1080" height="1600" fill="url(#bg_vignette)"/>
</svg>
