<?xml version="1.0" encoding="UTF-8"?>
<!-- Stadt-Hintergrund Menschen, Iteration 3 (Travian-Stil).
     Ovaler Stadtinnenraum mit Steinmauer, Eingangstor unten, Plaza
     im Zentrum, Sandwege strahlenfoermig zu jedem Gebaeude-Hotspot.
     Drumherum: Wiese, Baeume, Hintergrund-Berge.
     ViewBox: 1080x1600 (Stage-Aspect).
     Gebaeude-Hotspots (data/city_layout.json) liegen innerhalb der Mauer. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1600">
  <defs>
    <linearGradient id="bg_sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#3a567c"/>
      <stop offset="0.5"  stop-color="#7a98b8"/>
      <stop offset="1"    stop-color="#c8b890"/>
    </linearGradient>
    <radialGradient id="bg_sun_glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#fff4cc" stop-opacity="0.65"/>
      <stop offset="0.5" stop-color="#f8d068" stop-opacity="0.22"/>
      <stop offset="1"   stop-color="#f8d068" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg_far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e7c8c"/>
      <stop offset="1" stop-color="#5a6878"/>
    </linearGradient>
    <linearGradient id="bg_outer_grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a8a44"/>
      <stop offset="1" stop-color="#3e5824"/>
    </linearGradient>
    <radialGradient id="bg_inner_grass" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#8aa452"/>
      <stop offset="1" stop-color="#5e7a38"/>
    </radialGradient>
    <linearGradient id="bg_wall_stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8988a"/>
      <stop offset="1" stop-color="#6c5e50"/>
    </linearGradient>
    <radialGradient id="bg_plaza" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d8c8a0"/>
      <stop offset="1" stop-color="#a89272"/>
    </radialGradient>
    <radialGradient id="bg_vignette" cx="0.5" cy="0.55" r="0.75">
      <stop offset="0.7" stop-color="#000" stop-opacity="0"/>
      <stop offset="1"   stop-color="#000" stop-opacity="0.4"/>
    </radialGradient>
  </defs>

  <!-- Himmel (kleinerer Streifen, jetzt nur oberer Bereich) -->
  <rect x="0" y="0" width="1080" height="540" fill="url(#bg_sky)"/>
  <!-- Sonne oben-links -->
  <circle cx="170" cy="170" r="170" fill="url(#bg_sun_glow)"/>
  <circle cx="170" cy="170" r="42"  fill="#f4d674" opacity="0.78"/>
  <circle cx="170" cy="170" r="28"  fill="#fff4cc"/>
  <!-- Wolken -->
  <ellipse cx="420" cy="220" rx="100" ry="18" fill="#fff" opacity="0.30"/>
  <ellipse cx="460" cy="210" rx="60"  ry="12" fill="#fff" opacity="0.32"/>
  <ellipse cx="820" cy="280" rx="120" ry="22" fill="#fff" opacity="0.22"/>
  <ellipse cx="850" cy="270" rx="70"  ry="14" fill="#fff" opacity="0.24"/>

  <!-- Fernberge (dezent, halbverdeckt vom Aussenland) -->
  <path d="M -20 510 L 80 420 L 200 480 L 340 400 L 480 470 L 620 410 L 760 480 L 900 420 L 1080 480 L 1100 540 L -20 540 Z"
        fill="url(#bg_far)" opacity="0.9"/>

  <!-- Aussen-Land: Wiese rundum -->
  <rect x="0" y="500" width="1080" height="1100" fill="url(#bg_outer_grass)"/>

  <!-- Sand/Erde-Streifen am Aussenrand der Stadt (Andeutung Wegkreuzung) -->
  <ellipse cx="540" cy="920" rx="500" ry="420" fill="#7a6644" opacity="0.55"/>

  <!-- Baeume aussen, locker verteilt rund um die Stadt -->
  <g opacity="0.95">
    <!-- Hinten links -->
    <ellipse cx="68"  cy="640" rx="30" ry="42" fill="#324624"/>
    <rect    x="62"   y="660"  width="12" height="40" fill="#4a3220"/>
    <ellipse cx="44"  cy="624" rx="22" ry="30" fill="#3a5028"/>
    <!-- Hinten rechts -->
    <ellipse cx="1014" cy="660" rx="32" ry="44" fill="#324624"/>
    <rect    x="1008" y="678"  width="12" height="42" fill="#4a3220"/>
    <ellipse cx="1036" cy="640" rx="22" ry="32" fill="#3a5028"/>
    <ellipse cx="996"  cy="688" rx="20" ry="28" fill="#324624"/>
    <!-- Links mitte -->
    <ellipse cx="42"   cy="980"  rx="28" ry="40" fill="#324624"/>
    <rect    x="36"    y="998"   width="12" height="40" fill="#4a3220"/>
    <ellipse cx="38"   cy="1280" rx="32" ry="44" fill="#324624"/>
    <rect    x="32"    y="1298"  width="12" height="42" fill="#4a3220"/>
    <ellipse cx="60"   cy="1258" rx="24" ry="32" fill="#3a5028"/>
    <!-- Rechts mitte -->
    <ellipse cx="1042" cy="1000" rx="30" ry="42" fill="#324624"/>
    <rect    x="1036"  y="1020"  width="12" height="40" fill="#4a3220"/>
    <ellipse cx="1024" cy="1300" rx="34" ry="46" fill="#324624"/>
    <rect    x="1018"  y="1318"  width="12" height="44" fill="#4a3220"/>
    <ellipse cx="1046" cy="1278" rx="24" ry="32" fill="#3a5028"/>
    <!-- Vorn -->
    <ellipse cx="80"   cy="1480" rx="34" ry="48" fill="#2c3c20"/>
    <rect    x="74"    y="1500"  width="14" height="50" fill="#4a3220"/>
    <ellipse cx="1000" cy="1500" rx="36" ry="50" fill="#2c3c20"/>
    <rect    x="994"   y="1522"  width="14" height="50" fill="#4a3220"/>
  </g>

  <!-- Innerer Stadt-Bereich (heller Gras). Markiert den Innenraum auch
       wenn die Mauer NICHT gebaut ist. Mauer + Tor + Tuerme leben jetzt
       in wall_overlay.svg und werden vom CityScreen nur dann drueber-
       gezeichnet, wenn das Gebaeude "mauer" gebaut wurde. -->
  <ellipse cx="540" cy="920" rx="442" ry="350" fill="url(#bg_inner_grass)"/>

  <!-- PLAZA in der Mitte: heller Stein-Kreis -->
  <ellipse cx="540" cy="920" rx="86" ry="44" fill="url(#bg_plaza)" stroke="#7a644a" stroke-width="2"/>
  <!-- Brunnen-Andeutung in der Plaza-Mitte -->
  <ellipse cx="540" cy="920" rx="22" ry="12" fill="#445c66" stroke="#2a3a40" stroke-width="2"/>
  <ellipse cx="540" cy="918" rx="22" ry="10" fill="#6a8a98"/>
  <ellipse cx="540" cy="916" rx="14" ry="6"  fill="#88a8b6"/>
  <!-- Brunnen-Mauer Rand -->
  <ellipse cx="540" cy="922" rx="22" ry="6"  fill="#7a644a"/>

  <!-- WEGE: sandige Pfade von Plaza zu den 7 Gebaeude-Slots.
       Hotspots (siehe city_layout.json):
         kapelle  (0.50, 0.34) = (540, 544)
         schmiede (0.27, 0.46) = (292, 736)
         reiterei (0.73, 0.46) = (788, 736)
         markt    (0.18, 0.62) = (194, 992)
         wachturm (0.82, 0.62) = (886, 992)
         kaserne  (0.34, 0.76) = (367, 1216)
         spaeher  (0.66, 0.76) = (713, 1216) -->
  <g stroke="#b8a070" stroke-width="34" stroke-linecap="round" opacity="0.9" fill="none">
    <line x1="540" y1="920" x2="540" y2="600"/>
    <line x1="540" y1="920" x2="320" y2="780"/>
    <line x1="540" y1="920" x2="760" y2="780"/>
    <line x1="540" y1="920" x2="240" y2="980"/>
    <line x1="540" y1="920" x2="840" y2="980"/>
    <line x1="540" y1="920" x2="400" y2="1180"/>
    <line x1="540" y1="920" x2="680" y2="1180"/>
  </g>
  <!-- Weg vom Tor zum Plaza -->
  <line x1="540" y1="920" x2="540" y2="1296" stroke="#b8a070" stroke-width="42"
        stroke-linecap="round" opacity="0.9"/>
  <!-- Plaza-Umrandung erneut darueber (damit Pfade nicht in den Brunnen laufen) -->
  <ellipse cx="540" cy="920" rx="86" ry="44" fill="url(#bg_plaza)" stroke="#7a644a" stroke-width="2"/>
  <ellipse cx="540" cy="920" rx="22" ry="12" fill="#445c66" stroke="#2a3a40" stroke-width="2"/>
  <ellipse cx="540" cy="918" rx="22" ry="10" fill="#6a8a98"/>
  <ellipse cx="540" cy="916" rx="14" ry="6"  fill="#88a8b6"/>
  <ellipse cx="540" cy="922" rx="22" ry="6"  fill="#7a644a"/>

  <!-- ===== Stadt-Innenraum-Deko: kleine Huetten, Brunnen, Gaerten und
       sonstige Lebenszeichen, damit die Stadt nicht nur aus den 7 Haupt-
       gebaeuden besteht. Alles bewusst klein/dezent, sodass die Sprites
       darueber dominieren koennen. Iso-Konvention: Licht von oben-links. -->

  <!-- Garten-Beete (rechteckig, gestreift) -->
  <g opacity="0.92">
    <!-- Garten links zwischen Markt und Kaserne -->
    <polygon points="84,1080 192,1100 192,1170 84,1150" fill="#5a4628" stroke="#2a1c0e" stroke-width="1"/>
    <line x1="92"  y1="1086" x2="186" y2="1106" stroke="#7a8a3a" stroke-width="3"/>
    <line x1="92"  y1="1102" x2="186" y2="1122" stroke="#7a8a3a" stroke-width="3"/>
    <line x1="92"  y1="1118" x2="186" y2="1138" stroke="#7a8a3a" stroke-width="3"/>
    <line x1="92"  y1="1134" x2="186" y2="1154" stroke="#7a8a3a" stroke-width="3"/>
    <!-- Garten rechts -->
    <polygon points="884,1100 992,1080 992,1150 884,1170" fill="#5a4628" stroke="#2a1c0e" stroke-width="1"/>
    <line x1="892" y1="1106" x2="986" y2="1086" stroke="#7a8a3a" stroke-width="3"/>
    <line x1="892" y1="1122" x2="986" y2="1102" stroke="#7a8a3a" stroke-width="3"/>
    <line x1="892" y1="1138" x2="986" y2="1118" stroke="#7a8a3a" stroke-width="3"/>
    <line x1="892" y1="1154" x2="986" y2="1134" stroke="#7a8a3a" stroke-width="3"/>
  </g>

  <!-- Kleine Wohnhuetten zwischen den Hauptgebaeuden -->
  <g>
    <!-- Huette oben-links zwischen Kapelle und Schmiede -->
    <polygon points="394,624 470,624 470,672 394,672" fill="#caa97a" stroke="#3a2c1a" stroke-width="1.5"/>
    <polygon points="394,624 432,596 470,624" fill="#9c3d2c" stroke="#5a1410" stroke-width="1.5"/>
    <rect x="420" y="640" width="10" height="14" fill="#3a2c1a"/>
    <rect x="445" y="635" width="8"  height="8"  fill="#3a2c1a"/>
    <ellipse cx="432" cy="676" rx="42" ry="5" fill="#000" opacity="0.35"/>
    <!-- Huette oben-rechts -->
    <polygon points="612,624 688,624 688,672 612,672" fill="#caa97a" stroke="#3a2c1a" stroke-width="1.5"/>
    <polygon points="612,624 650,596 688,624" fill="#9c3d2c" stroke="#5a1410" stroke-width="1.5"/>
    <rect x="638" y="640" width="10" height="14" fill="#3a2c1a"/>
    <rect x="663" y="635" width="8"  height="8"  fill="#3a2c1a"/>
    <ellipse cx="650" cy="676" rx="42" ry="5" fill="#000" opacity="0.35"/>
    <!-- Huette unten Mitte links -->
    <polygon points="464,1100 540,1100 540,1148 464,1148" fill="#caa97a" stroke="#3a2c1a" stroke-width="1.5"/>
    <polygon points="464,1100 502,1072 540,1100" fill="#9c3d2c" stroke="#5a1410" stroke-width="1.5"/>
    <rect x="490" y="1116" width="10" height="14" fill="#3a2c1a"/>
    <ellipse cx="502" cy="1152" rx="42" ry="5" fill="#000" opacity="0.35"/>
    <!-- Huette unten Mitte rechts -->
    <polygon points="540,1100 616,1100 616,1148 540,1148" fill="#caa97a" stroke="#3a2c1a" stroke-width="1.5"/>
    <polygon points="540,1100 578,1072 616,1100" fill="#9c3d2c" stroke="#5a1410" stroke-width="1.5"/>
    <rect x="566" y="1116" width="10" height="14" fill="#3a2c1a"/>
    <ellipse cx="578" cy="1152" rx="42" ry="5" fill="#000" opacity="0.35"/>
  </g>

  <!-- Marktstand am Plaza-Rand (zur Belebung) -->
  <g>
    <polygon points="420,886 484,896 484,920 420,910" fill="#7a5a30" stroke="#2a1a08" stroke-width="1"/>
    <polygon points="416,884 488,894 488,886 416,876" fill="#c93a2c" opacity="0.85"/>
    <polygon points="416,876 488,886 488,880 416,870" fill="#e6e0c8" opacity="0.85"/>
    <line x1="420" y1="876" x2="420" y2="906" stroke="#3a2614" stroke-width="2"/>
    <line x1="484" y1="886" x2="484" y2="916" stroke="#3a2614" stroke-width="2"/>
    <circle cx="440" cy="902" r="4" fill="#caa472"/>
    <circle cx="460" cy="906" r="3.5" fill="#a8845c"/>
    <circle cx="472" cy="908" r="3" fill="#caa472"/>
  </g>

  <!-- Holzstapel zwischen Schmiede und Kaserne -->
  <g>
    <ellipse cx="218" cy="912" rx="28" ry="6" fill="#000" opacity="0.35"/>
    <rect x="194" y="898" width="48" height="6" fill="#7a5a30" stroke="#2a1a08" stroke-width="0.8"/>
    <rect x="194" y="890" width="48" height="6" fill="#9a7240" stroke="#2a1a08" stroke-width="0.8"/>
    <rect x="194" y="882" width="48" height="6" fill="#7a5a30" stroke="#2a1a08" stroke-width="0.8"/>
    <circle cx="200" cy="892" r="2.5" fill="#5a3a18"/>
    <circle cx="200" cy="900" r="2.5" fill="#5a3a18"/>
    <circle cx="236" cy="892" r="2.5" fill="#5a3a18"/>
    <circle cx="236" cy="900" r="2.5" fill="#5a3a18"/>
  </g>

  <!-- Schaf-Pferch zwischen Reiterei und Wachturm -->
  <g>
    <ellipse cx="860" cy="914" rx="48" ry="14" fill="#5e7a38" opacity="0.6"/>
    <!-- Zaun -->
    <g stroke="#5a3a18" stroke-width="1.5">
      <line x1="816" y1="908" x2="816" y2="922"/>
      <line x1="836" y1="906" x2="836" y2="920"/>
      <line x1="856" y1="904" x2="856" y2="918"/>
      <line x1="876" y1="906" x2="876" y2="920"/>
      <line x1="896" y1="908" x2="896" y2="922"/>
      <line x1="816" y1="912" x2="896" y2="912"/>
    </g>
    <!-- Schafe (kleine weisse Wuelste) -->
    <ellipse cx="840" cy="912" rx="6" ry="4" fill="#f0f0f0"/>
    <circle  cx="844" cy="910" r="2.5" fill="#f0f0f0"/>
    <ellipse cx="864" cy="916" rx="6" ry="4" fill="#f0f0f0"/>
    <circle  cx="868" cy="914" r="2.5" fill="#f0f0f0"/>
    <ellipse cx="880" cy="910" rx="6" ry="4" fill="#f0f0f0"/>
    <circle  cx="884" cy="908" r="2.5" fill="#f0f0f0"/>
  </g>

  <!-- Statue am Plaza-Sockel (Heldenstatue, klein) -->
  <g>
    <ellipse cx="612" cy="930" rx="12" ry="4" fill="#000" opacity="0.45"/>
    <rect x="606" y="906" width="12" height="22" fill="#7a644a" stroke="#3a2c1a" stroke-width="1"/>
    <rect x="608" y="884" width="8"  height="24" fill="#a8988a" stroke="#3a2c1a" stroke-width="0.8"/>
    <ellipse cx="612" cy="880" rx="4" ry="5" fill="#a8988a" stroke="#3a2c1a" stroke-width="0.8"/>
    <line x1="616" y1="894" x2="624" y2="884" stroke="#3a2c1a" stroke-width="1.5"/>
  </g>

  <!-- Restliche kleine Detailspots: Buesche und Mini-Baeume -->
  <g opacity="0.88">
    <ellipse cx="280"  cy="850"  rx="14" ry="9" fill="#3e5e24"/>
    <ellipse cx="276"  cy="846"  rx="6"  ry="4" fill="#54743a"/>
    <ellipse cx="800"  cy="850"  rx="14" ry="9" fill="#3e5e24"/>
    <ellipse cx="804"  cy="846"  rx="6"  ry="4" fill="#54743a"/>
    <ellipse cx="350"  cy="1290" rx="12" ry="8" fill="#3e5e24"/>
    <ellipse cx="730"  cy="1290" rx="12" ry="8" fill="#3e5e24"/>
    <!-- Mini-Bauminseln -->
    <ellipse cx="282"  cy="838"  rx="10" ry="14" fill="#324624"/>
    <ellipse cx="798"  cy="838"  rx="10" ry="14" fill="#324624"/>
  </g>

  <!-- Schatten-Vignette: weniger stark als vorher, damit der innenraum
       hell und einladend wirkt -->
  <rect x="0" y="0" width="1080" height="1600" fill="url(#bg_vignette)"/>
</svg>
