<?xml version="1.0" encoding="UTF-8"?>
<!-- Wachturm. Schmal und hoch, Stein, Zinnen oben. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="wt_wallL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a39080"/>
      <stop offset="1" stop-color="#766656"/>
    </linearGradient>
    <linearGradient id="wt_wallR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6c5e50"/>
      <stop offset="1" stop-color="#403628"/>
    </linearGradient>
    <linearGradient id="wt_roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a04030"/>
      <stop offset="1" stop-color="#6c2820"/>
    </linearGradient>
  </defs>

  <!-- Boden-Schatten kleiner, weil schmaler -->
  <ellipse cx="256" cy="388" rx="120" ry="22" fill="#000" opacity="0.35"/>

  <!-- Basis-Sockel (breiter als Turm) -->
  <polygon points="176,308 256,348 336,308 256,272" fill="#5e5246" stroke="#2a2418" stroke-width="2"/>
  <polygon points="176,308 256,348 256,360 176,322" fill="#4a3e32"/>
  <polygon points="256,348 336,308 336,322 256,360" fill="#352a20"/>

  <!-- Linke Wand (hoch, schmal) -->
  <polygon points="192,300 256,332 256,72 192,40" fill="url(#wt_wallL)"
           stroke="#2a2418" stroke-width="2"/>
  <!-- Steinfugen -->
  <line x1="192" y1="100" x2="256" y2="132" stroke="#4e4030" stroke-width="1.2" opacity="0.5"/>
  <line x1="192" y1="160" x2="256" y2="192" stroke="#4e4030" stroke-width="1.2" opacity="0.5"/>
  <line x1="192" y1="220" x2="256" y2="252" stroke="#4e4030" stroke-width="1.2" opacity="0.5"/>
  <line x1="192" y1="280" x2="256" y2="312" stroke="#4e4030" stroke-width="1.2" opacity="0.5"/>

  <!-- Schiessscharten links -->
  <polygon points="216,180 234,189 234,168 216,159" fill="#1a1006"/>
  <polygon points="216,236 234,245 234,224 216,215" fill="#1a1006"/>

  <!-- Tor unten -->
  <polygon points="206,300 246,320 246,272 206,252" fill="#1a1006"/>
  <polygon points="212,302 240,316 240,278 212,260" fill="#0c0904"/>

  <!-- Rechte Wand -->
  <polygon points="256,332 320,300 320,40 256,72" fill="url(#wt_wallR)"
           stroke="#1a1610" stroke-width="2"/>
  <line x1="256" y1="132" x2="320" y2="100" stroke="#2c241a" stroke-width="1.2" opacity="0.5"/>
  <line x1="256" y1="192" x2="320" y2="160" stroke="#2c241a" stroke-width="1.2" opacity="0.5"/>
  <line x1="256" y1="252" x2="320" y2="220" stroke="#2c241a" stroke-width="1.2" opacity="0.5"/>

  <polygon points="278,180 296,170 296,148 278,158" fill="#1a1006"/>
  <polygon points="278,236 296,226 296,204 278,214" fill="#1a1006"/>

  <!-- Zinnen-Krone: Iso-Raute mit Erkern -->
  <polygon points="256,16 320,40 256,72 192,40" fill="#6c5e50" stroke="#2a2418" stroke-width="2"/>
  <!-- Zinnenkrone vorn (S-Seite) -->
  <polygon points="208,46 222,52 222,34 208,28" fill="#6c5e50"/>
  <polygon points="236,58 250,64 250,46 236,40" fill="#6c5e50"/>
  <polygon points="264,58 278,52 278,34 264,40" fill="#5a4e42"/>
  <polygon points="290,46 304,40 304,22 290,28" fill="#5a4e42"/>

  <!-- Mini-Spitzdach in der Mitte (rotes Dachzelt) -->
  <polygon points="256,16 282,28 256,52 230,28" fill="url(#wt_roof)" stroke="#3a1410" stroke-width="1.5"/>

  <!-- Flagge -->
  <line x1="256" y1="-4" x2="256" y2="16" stroke="#2a1a08" stroke-width="2"/>
  <polygon points="256,-4 280,2 256,10" fill="#c93a2c"/>
</svg>
