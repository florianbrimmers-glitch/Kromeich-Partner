<?xml version="1.0" encoding="UTF-8"?>
<!-- Stadtmauer-Hotspot-Sprite. Sitzt am Tor unten Mitte als kleines
     Stein-Segment mit Zinnen und Banner. Die richtige Mauer-Ringschicht
     liegt in wall_overlay.svg und wird vom CityScreen separat gezeichnet
     wenn das Gebaeude gebaut ist. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="mr_wallL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8988a"/>
      <stop offset="1" stop-color="#7a6a5e"/>
    </linearGradient>
    <linearGradient id="mr_wallR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6c5e50"/>
      <stop offset="1" stop-color="#403628"/>
    </linearGradient>
  </defs>
  <ellipse cx="256" cy="392" rx="210" ry="32" fill="#000" opacity="0.4"/>

  <!-- Mauer-Linker Iso-Block -->
  <polygon points="64,288 256,384 256,232 64,136" fill="url(#mr_wallL)" stroke="#2a1e12" stroke-width="2.5"/>
  <line x1="120" y1="166" x2="120" y2="320" stroke="#3a2c1c" stroke-width="1.5" opacity="0.55"/>
  <line x1="180" y1="196" x2="180" y2="352" stroke="#3a2c1c" stroke-width="1.5" opacity="0.55"/>
  <line x1="220" y1="216" x2="220" y2="372" stroke="#3a2c1c" stroke-width="1.5" opacity="0.55"/>
  <!-- Stein-Quader-Andeutung in Zeilen -->
  <line x1="64"  y1="200" x2="256" y2="296" stroke="#3a2c1c" stroke-width="1.2" opacity="0.4"/>
  <line x1="64"  y1="240" x2="256" y2="336" stroke="#3a2c1c" stroke-width="1.2" opacity="0.4"/>

  <!-- Mauer-Rechter Iso-Block -->
  <polygon points="256,384 448,288 448,136 256,232" fill="url(#mr_wallR)" stroke="#1a1610" stroke-width="2.5"/>
  <line x1="312" y1="356" x2="312" y2="200" stroke="#241a10" stroke-width="1.5" opacity="0.6"/>
  <line x1="372" y1="326" x2="372" y2="170" stroke="#241a10" stroke-width="1.5" opacity="0.6"/>
  <line x1="424" y1="300" x2="424" y2="144" stroke="#241a10" stroke-width="1.5" opacity="0.6"/>
  <line x1="256" y1="280" x2="448" y2="184" stroke="#241a10" stroke-width="1.2" opacity="0.4"/>
  <line x1="256" y1="320" x2="448" y2="224" stroke="#241a10" stroke-width="1.2" opacity="0.4"/>

  <!-- Mauerkrone (Iso-Raute) -->
  <polygon points="256,40 448,136 256,232 64,136" fill="#5e4e3a" stroke="#1a120a" stroke-width="2"/>
  <line x1="256" y1="40" x2="256" y2="232" stroke="#1a120a" stroke-width="1" opacity="0.6"/>

  <!-- Zinnen vorne auf der Krone -->
  <g fill="#5e4e3a" stroke="#1a120a" stroke-width="1">
    <polygon points="100,148 124,160 124,128 100,116"/>
    <polygon points="160,180 184,192 184,160 160,148"/>
    <polygon points="220,212 244,224 244,192 220,180"/>
    <polygon points="280,212 304,200 304,168 280,180"/>
    <polygon points="340,180 364,168 364,136 340,148"/>
    <polygon points="400,148 424,136 424,104 400,116"/>
  </g>

  <!-- Banner mittig oben -->
  <line x1="256" y1="40" x2="256" y2="0" stroke="#3a2c1a" stroke-width="3"/>
  <polygon points="256,4 296,14 256,24" fill="#c93a2c" stroke="#5a1410" stroke-width="0.8"/>

  <!-- Stein-Sockel-Andeutung vorne -->
  <polygon points="64,288 256,384 256,392 64,296" fill="#3a2c1c"/>
  <polygon points="256,384 448,288 448,296 256,392" fill="#241a10"/>
</svg>
