<?xml version="1.0" encoding="UTF-8"?>
<!-- Wall-Overlay fuer Menschen. Wird vom CityScreen DRAUEBER auf bg.svg
     gezeichnet, wenn das Gebaeude "mauer" gebaut ist. Ohne Mauer ist
     die Stadt offen (nur innere Gras-Ellipse aus bg.svg).
     Selbe ViewBox 1080x1600 wie bg.svg, damit dieselbe Transformation
     greift. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1600">
  <defs>
    <linearGradient id="bg_wall_stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8988a"/>
      <stop offset="1" stop-color="#6c5e50"/>
    </linearGradient>
    <!-- Mask: weiss = Wall-Ring sichtbar, schwarz = ausgeschnitten. Damit
         die Mauer als Ring wirkt und das Stadt-Innere von bg.svg
         (inner_grass + Plaza + Deko) durchscheint. -->
    <mask id="wall_ring_mask" maskUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1080" height="1600" fill="black"/>
      <ellipse cx="540" cy="920" rx="488" ry="388" fill="white"/>
      <ellipse cx="540" cy="920" rx="440" ry="348" fill="black"/>
    </mask>
  </defs>

  <!-- STADTMAUER: konzentrische Ellipsen, geclippt auf den Ring durch
       die Mask oben. Aussen-Schatten -> Aussenwand -> Mauerkrone ->
       Innen-Schatten. Innerhalb des Rings ist transparent (was bg.svg
       zeichnet bleibt sichtbar). -->
  <g mask="url(#wall_ring_mask)">
    <ellipse cx="540" cy="920" rx="486" ry="386" fill="#1c140c" opacity="0.85"/>
    <ellipse cx="540" cy="920" rx="478" ry="378" fill="#6e5a44"/>
    <ellipse cx="540" cy="920" rx="466" ry="370" fill="url(#bg_wall_stone)"/>
    <ellipse cx="540" cy="920" rx="450" ry="358" fill="#5a4636"/>
    <ellipse cx="540" cy="920" rx="442" ry="350" fill="#3a2e22"/>
  </g>

  <!-- Stein-Block-Fugen auf der Mauerkrone -->
  <g stroke="#3a2c1c" stroke-width="1.2" opacity="0.55">
    <line x1="1012" y1="920"  x2="990"  y2="920"/>
    <line x1="996"  y1="1016" x2="975"  y2="1004"/>
    <line x1="949"  y1="1107" x2="932"  y2="1090"/>
    <line x1="874"  y1="1184" x2="861"  y2="1163"/>
    <line x1="776"  y1="1244" x2="769"  y2="1220"/>
    <line x1="304"  y1="1244" x2="311"  y2="1220"/>
    <line x1="206"  y1="1184" x2="219"  y2="1163"/>
    <line x1="131"  y1="1107" x2="148"  y2="1090"/>
    <line x1="84"   y1="1016" x2="105"  y2="1004"/>
    <line x1="68"   y1="920"  x2="90"   y2="920"/>
    <line x1="84"   y1="823"  x2="105"  y2="836"/>
    <line x1="131"  y1="733"  x2="148"  y2="750"/>
    <line x1="206"  y1="656"  x2="219"  y2="677"/>
    <line x1="304"  y1="596"  x2="311"  y2="620"/>
    <line x1="418"  y1="559"  x2="421"  y2="584"/>
    <line x1="540"  y1="546"  x2="540"  y2="572"/>
    <line x1="662"  y1="559"  x2="659"  y2="584"/>
    <line x1="776"  y1="596"  x2="769"  y2="620"/>
    <line x1="874"  y1="656"  x2="861"  y2="677"/>
    <line x1="949"  y1="733"  x2="932"  y2="750"/>
    <line x1="996"  y1="823"  x2="975"  y2="836"/>
  </g>

