<?xml version="1.0" encoding="UTF-8"?>
<!-- Kapelle. Klein, spitzes Dach, buntes Rosettenfenster, Glocke (kein Kreuz,
     IP-Distanz zu HoMM). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="kp_wallL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c498"/>
      <stop offset="1" stop-color="#a89270"/>
    </linearGradient>
    <linearGradient id="kp_wallR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e7e60"/>
      <stop offset="1" stop-color="#5a4e3a"/>
    </linearGradient>
    <linearGradient id="kp_roofL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a5878"/>
      <stop offset="1" stop-color="#1f3850"/>
    </linearGradient>
    <linearGradient id="kp_roofR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243f5a"/>
      <stop offset="1" stop-color="#10243a"/>
    </linearGradient>
    <radialGradient id="kp_glass" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#f7e890"/>
      <stop offset="0.5" stop-color="#caa848"/>
      <stop offset="1" stop-color="#7a3a32"/>
    </radialGradient>
  </defs>

  <!-- Boden-Schatten -->
  <ellipse cx="256" cy="392" rx="170" ry="28" fill="#000" opacity="0.32"/>

  <!-- Linke Wand (mittelhoch ~144) -->
  <polygon points="96,288 256,368 256,224 96,144" fill="url(#kp_wallL)"
           stroke="#3a2c18" stroke-width="2"/>
  <!-- Steinfugen -->
  <line x1="136" y1="164" x2="136" y2="338" stroke="#7a6240" stroke-width="1.2" opacity="0.5"/>
  <line x1="180" y1="186" x2="180" y2="354" stroke="#7a6240" stroke-width="1.2" opacity="0.5"/>
  <line x1="220" y1="208" x2="220" y2="364" stroke="#7a6240" stroke-width="1.2" opacity="0.5"/>

  <!-- Bogentor (gerundet oben) -->
  <path d="M 144,322 L 144,260 Q 144,236 168,238 Q 192,242 200,252 L 200,310 Z"
        fill="#2a1a0a"/>
  <path d="M 152,318 L 152,266 Q 152,244 172,246 Q 188,250 194,260 L 194,308 Z"
        fill="#3c2614"/>

  <!-- Rechte Wand -->
  <polygon points="256,368 416,288 416,144 256,224" fill="url(#kp_wallR)"
           stroke="#241a0d" stroke-width="2"/>
  <line x1="296" y1="348" x2="296" y2="204" stroke="#3c3020" stroke-width="1.2" opacity="0.55"/>
  <line x1="340" y1="326" x2="340" y2="182" stroke="#3c3020" stroke-width="1.2" opacity="0.55"/>
  <line x1="384" y1="304" x2="384" y2="160" stroke="#3c3020" stroke-width="1.2" opacity="0.55"/>

  <!-- Rosetten-Fenster -->
  <circle cx="336" cy="252" r="22" fill="#1a1408" stroke="#3a2a16" stroke-width="2"/>
  <circle cx="336" cy="252" r="18" fill="url(#kp_glass)"/>
  <line x1="336" y1="234" x2="336" y2="270" stroke="#3a2a16" stroke-width="1.4"/>
  <line x1="318" y1="252" x2="354" y2="252" stroke="#3a2a16" stroke-width="1.4"/>
  <line x1="323" y1="239" x2="349" y2="265" stroke="#3a2a16" stroke-width="1"/>
  <line x1="349" y1="239" x2="323" y2="265" stroke="#3a2a16" stroke-width="1"/>

  <!-- Spitzdach: zwei Dreiecke (linke + rechte Schraege) treffen ueber Mittellinie -->
  <!-- Mittelfirst hoch oben: ~y=20 -->
  <polygon points="256,20 256,224 96,144" fill="url(#kp_roofL)" stroke="#0e1a26" stroke-width="2"/>
  <polygon points="256,20 416,144 256,224" fill="url(#kp_roofR)" stroke="#0a1422" stroke-width="2"/>

  <!-- Glocke unter Mini-Vordach im Giebel -->
  <polygon points="240,86 272,98 272,72 240,60" fill="#3a2a14"/>
  <ellipse cx="256" cy="92" rx="9" ry="7" fill="#c9a52e"/>
  <line x1="256" y1="86" x2="256" y2="74" stroke="#7a5a18" stroke-width="2"/>

  <!-- Spitze: kleine goldene Kugel -->
  <circle cx="256" cy="14" r="6" fill="#e6c247" stroke="#7a5a18" stroke-width="1"/>
</svg>
