<?xml version="1.0" encoding="UTF-8"?>
<!-- Spaeher. Holz-Aussichtsturm mit klar erkennbarem Wachposten + Fernrohr,
     groesserer Plattform und groesserer Signalflagge. Iteration 2 nach
     Phone-Feedback: vorher schwer als "Spaehposten" lesbar. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sp_post" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5a30"/>
      <stop offset="1" stop-color="#3a2614"/>
    </linearGradient>
    <linearGradient id="sp_platL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a7244"/>
      <stop offset="1" stop-color="#6c4a24"/>
    </linearGradient>
    <linearGradient id="sp_platR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#624626"/>
      <stop offset="1" stop-color="#3c2810"/>
    </linearGradient>
    <linearGradient id="sp_thatch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#caa050"/>
      <stop offset="1" stop-color="#8a6c30"/>
    </linearGradient>
  </defs>

  <!-- Boden-Schatten -->
  <ellipse cx="256" cy="388" rx="148" ry="28" fill="#000" opacity="0.32"/>

  <!-- Vier Holzstelzen -->
  <polygon points="148,360 162,368 162,212 148,204" fill="url(#sp_post)" stroke="#2a1a08" stroke-width="1"/>
  <polygon points="350,360 364,352 364,196 350,204" fill="url(#sp_post)" stroke="#2a1a08" stroke-width="1"/>
  <polygon points="246,378 260,378 260,210 246,210" fill="url(#sp_post)" stroke="#2a1a08" stroke-width="1"/>
  <!-- Hintere Stelze (mehr im Schatten) -->
  <polygon points="248,316 258,316 258,154 248,154" fill="#3a2614" opacity="0.85"/>

  <!-- Leiter links: deutlich erkennbar -->
  <polygon points="138,360 152,366 152,208 138,202" fill="#5a3a18"/>
  <line x1="140" y1="222" x2="150" y2="226" stroke="#2a1a08" stroke-width="1.5"/>
  <line x1="140" y1="250" x2="150" y2="254" stroke="#2a1a08" stroke-width="1.5"/>
  <line x1="140" y1="278" x2="150" y2="282" stroke="#2a1a08" stroke-width="1.5"/>
  <line x1="140" y1="306" x2="150" y2="310" stroke="#2a1a08" stroke-width="1.5"/>
  <line x1="140" y1="334" x2="150" y2="338" stroke="#2a1a08" stroke-width="1.5"/>

  <!-- Diagonale Stuetzbalken -->
  <line x1="158" y1="282" x2="248" y2="252" stroke="#3a2614" stroke-width="3"/>
  <line x1="354" y1="280" x2="258" y2="252" stroke="#3a2614" stroke-width="3"/>

  <!-- Plattform: Iso-Raute -->
  <polygon points="256,158 364,204 256,250 148,204" fill="#5a3e1c" stroke="#2a1a08" stroke-width="2"/>
  <!-- Plattform-Bretter (Iso-Streifen) -->
  <line x1="180" y1="188" x2="288" y2="234" stroke="#3c2812" stroke-width="1.2" opacity="0.6"/>
  <line x1="208" y1="176" x2="316" y2="222" stroke="#3c2812" stroke-width="1.2" opacity="0.6"/>
  <line x1="232" y1="168" x2="340" y2="214" stroke="#3c2812" stroke-width="1.2" opacity="0.6"/>

  <!-- Gelaender / Bruestung -->
  <polygon points="148,204 256,250 256,226 148,180" fill="url(#sp_platL)" stroke="#2a1a08" stroke-width="1.5"/>
  <polygon points="256,250 364,204 364,180 256,226" fill="url(#sp_platR)" stroke="#2a1a08" stroke-width="1.5"/>
  <!-- Gelaender-Pfosten -->
  <line x1="186" y1="200" x2="186" y2="216" stroke="#2a1a08" stroke-width="1.4"/>
  <line x1="222" y1="218" x2="222" y2="234" stroke="#2a1a08" stroke-width="1.4"/>
  <line x1="294" y1="232" x2="294" y2="216" stroke="#2a1a08" stroke-width="1.4"/>
  <line x1="328" y1="216" x2="328" y2="200" stroke="#2a1a08" stroke-width="1.4"/>

  <!-- Wachposten auf der Plattform (Silhouette) mit Fernrohr.
       Steht etwa Mitte der Plattform-Tiefe, schaut nach rechts. -->
  <!-- Beine -->
  <rect x="226" y="172" width="6"  height="22" fill="#3a2614"/>
  <rect x="234" y="172" width="6"  height="22" fill="#3a2614"/>
  <!-- Koerper -->
  <polygon points="220,140 248,140 252,176 218,176" fill="#5a3a18"/>
  <!-- Umhang/Schulter -->
  <polygon points="218,138 250,138 252,160 216,160" fill="#3a2614"/>
  <!-- Kopf -->
  <circle cx="234" cy="128" r="9" fill="#caa472"/>
  <!-- Helm-Andeutung -->
  <path d="M 224,124 Q 234,114 244,124 Z" fill="#3a2614"/>
  <!-- Fernrohr in der Hand -->
  <rect x="244" y="142" width="56" height="6" fill="#1a1a08" transform="rotate(-6 244 142)"/>
  <circle cx="300" cy="138" r="5" fill="#e6c247"/>
  <!-- Arm -->
  <line x1="246" y1="148" x2="270" y2="143" stroke="#3a2614" stroke-width="5" stroke-linecap="round"/>

  <!-- Strohdach: ueberlebt den Wachposten, etwas hoeher angesetzt -->
  <polygon points="256,42 376,116 256,182 136,116" fill="url(#sp_thatch)"
           stroke="#5e4520" stroke-width="2"/>
  <!-- Strohstriche -->
  <line x1="176" y1="120" x2="240" y2="160" stroke="#5e4520" stroke-width="1.2" opacity="0.5"/>
  <line x1="276" y1="160" x2="340" y2="120" stroke="#5e4520" stroke-width="1.2" opacity="0.5"/>
  <line x1="196" y1="106" x2="240" y2="138" stroke="#5e4520" stroke-width="1.2" opacity="0.5"/>
  <line x1="276" y1="138" x2="320" y2="106" stroke="#5e4520" stroke-width="1.2" opacity="0.5"/>
  <line x1="216" y1="94" x2="240" y2="116" stroke="#5e4520" stroke-width="1.2" opacity="0.5"/>
  <line x1="276" y1="116" x2="300" y2="94" stroke="#5e4520" stroke-width="1.2" opacity="0.5"/>

  <!-- Grosse Signalflagge ueber dem Dach -->
  <line x1="256" y1="42" x2="256" y2="0" stroke="#3a2614" stroke-width="3.5"/>
  <polygon points="256,2 326,12 256,26" fill="#c93a2c"/>
  <polygon points="256,26 326,12 326,32 256,46" fill="#9a2418"/>
</svg>
