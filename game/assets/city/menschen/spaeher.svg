<?xml version="1.0" encoding="UTF-8"?>
<!-- Spaeher. Holz-Aussichtsturm: Stelzen, Plattform, Strohdach, Signalflagge. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sp_post" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5a30"/>
      <stop offset="1" stop-color="#3a2614"/>
    </linearGradient>
    <linearGradient id="sp_platL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a7244"/>
      <stop offset="1" stop-color="#6c4a24"/>
    </linearGradient>
    <linearGradient id="sp_platR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#624626"/>
      <stop offset="1" stop-color="#3c2810"/>
    </linearGradient>
    <linearGradient id="sp_thatch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#caa050"/>
      <stop offset="1" stop-color="#8a6c30"/>
    </linearGradient>
  </defs>

  <!-- Boden-Schatten -->
  <ellipse cx="256" cy="388" rx="140" ry="26" fill="#000" opacity="0.32"/>

  <!-- Vier Holzstelzen -->
  <polygon points="148,360 158,366 158,212 148,206" fill="url(#sp_post)"/>
  <polygon points="354,360 364,354 364,200 354,206" fill="url(#sp_post)"/>
  <polygon points="248,376 258,376 258,212 248,212" fill="url(#sp_post)"/>
  <!-- Hintere Stelze (mehr im Schatten) -->
  <polygon points="248,316 258,316 258,156 248,156" fill="#3a2614" opacity="0.85"/>

  <!-- Diagonale Stuetzbalken -->
  <line x1="158" y1="280" x2="248" y2="252" stroke="#3a2614" stroke-width="3"/>
  <line x1="354" y1="280" x2="258" y2="252" stroke="#3a2614" stroke-width="3"/>
  <line x1="158" y1="240" x2="248" y2="216" stroke="#3a2614" stroke-width="2.5" opacity="0.7"/>
  <line x1="354" y1="240" x2="258" y2="216" stroke="#3a2614" stroke-width="2.5" opacity="0.7"/>

  <!-- Plattform: Iso-Raute auf Hoehe der Pfostenoberseiten -->
  <polygon points="256,160 364,206 256,252 148,206" fill="#5a3e1c" stroke="#2a1a08" stroke-width="2"/>
  <!-- Plattform-Bretter (oben sichtbar) -->
  <line x1="180" y1="190" x2="288" y2="236" stroke="#3c2812" stroke-width="1" opacity="0.6"/>
  <line x1="208" y1="178" x2="316" y2="224" stroke="#3c2812" stroke-width="1" opacity="0.6"/>
  <line x1="232" y1="170" x2="340" y2="216" stroke="#3c2812" stroke-width="1" opacity="0.6"/>

  <!-- Gelaender / Bruestung -->
  <!-- Linke Seite -->
  <polygon points="148,206 256,252 256,228 148,182" fill="url(#sp_platL)" stroke="#2a1a08" stroke-width="1.5"/>
  <!-- Rechte Seite -->
  <polygon points="256,252 364,206 364,182 256,228" fill="url(#sp_platR)" stroke="#2a1a08" stroke-width="1.5"/>
  <!-- Gelaender-Staeben -->
  <line x1="186" y1="200" x2="186" y2="216" stroke="#2a1a08" stroke-width="1.4"/>
  <line x1="222" y1="218" x2="222" y2="234" stroke="#2a1a08" stroke-width="1.4"/>
  <line x1="294" y1="232" x2="294" y2="216" stroke="#2a1a08" stroke-width="1.4"/>
  <line x1="328" y1="216" x2="328" y2="200" stroke="#2a1a08" stroke-width="1.4"/>

  <!-- Strohdach: schraege Pyramide mit etwas ausladenden Kanten -->
  <polygon points="256,52 376,126 256,182 136,126" fill="url(#sp_thatch)"
           stroke="#5e4520" stroke-width="2"/>
  <!-- Strohstriche -->
  <line x1="176" y1="130" x2="240" y2="160" stroke="#5e4520" stroke-width="1.2" opacity="0.5"/>
  <line x1="276" y1="160" x2="340" y2="130" stroke="#5e4520" stroke-width="1.2" opacity="0.5"/>
  <line x1="200" y1="116" x2="240" y2="138" stroke="#5e4520" stroke-width="1.2" opacity="0.5"/>
  <line x1="276" y1="138" x2="316" y2="116" stroke="#5e4520" stroke-width="1.2" opacity="0.5"/>

  <!-- Signalflagge ueber dem Dach -->
  <line x1="256" y1="52" x2="256" y2="6" stroke="#3a2614" stroke-width="2.5"/>
  <polygon points="256,8 308,18 256,30" fill="#c93a2c"/>
  <polygon points="256,30 308,18 256,30" fill="#a02418"/>
</svg>
