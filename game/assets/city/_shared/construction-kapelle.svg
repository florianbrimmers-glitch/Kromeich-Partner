<?xml version="1.0" encoding="UTF-8"?>
<!-- Baustelle Kapelle: heller Stein-Sockel mit angefangenem Bogenfenster
     und angedeutetem Spitzdach-Geruest. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ck2_sL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c498"/>
      <stop offset="1" stop-color="#a89270"/>
    </linearGradient>
    <linearGradient id="ck2_sR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e7e60"/>
      <stop offset="1" stop-color="#5a4e3a"/>
    </linearGradient>
    <linearGradient id="ck2_beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87238"/>
      <stop offset="1" stop-color="#5c3c18"/>
    </linearGradient>
  </defs>
  <ellipse cx="256" cy="392" rx="160" ry="26" fill="#000" opacity="0.32"/>

  <!-- Linke Wand mit unebener Oberkante -->
  <path d="M 110,300 L 256,380 L 256,260 L 232,242 L 220,256 L 188,234 L 164,252 L 138,228 L 116,242 L 110,234 Z"
        fill="url(#ck2_sL)" stroke="#3a2c18" stroke-width="3"/>
  <!-- Bogenfenster angefangen -->
  <path d="M 144,290 L 144,238 Q 144,222 162,222 Q 180,222 188,228 L 188,288 Z"
        fill="#2a1a0a" opacity="0.7"/>

  <polygon points="256,380 402,300 402,260 256,260" fill="url(#ck2_sR)" stroke="#241a0d" stroke-width="3"/>
  <line x1="296" y1="356" x2="296" y2="276" stroke="#3c3020" stroke-width="1.4" opacity="0.6"/>
  <line x1="340" y1="334" x2="340" y2="254" stroke="#3c3020" stroke-width="1.4" opacity="0.6"/>

  <!-- DACH-GERUEST: Spitzdach im Bau, nur die zwei Hauptbalken -->
  <line x1="256" y1="260" x2="256" y2="90" stroke="#5c3c18" stroke-width="4"/>
  <polygon points="256,90 280,140 256,150 232,140" fill="url(#ck2_beam)"/>
  <line x1="120" y1="220" x2="256" y2="90" stroke="#5c3c18" stroke-width="3.5"/>
  <line x1="392" y1="220" x2="256" y2="90" stroke="#5c3c18" stroke-width="3.5"/>

  <!-- Stein-Block davor (nicht eingebaut) -->
  <polygon points="156,388 220,396 220,376 156,368" fill="#766658" stroke="#3a2c1c" stroke-width="1.5"/>

  <!-- Schubkarre -->
  <polygon points="262,386 332,396 332,378 262,368" fill="#8a6230"/>
  <circle cx="270" cy="394" r="9" fill="#2a1a08" stroke="#0c0604" stroke-width="1.5"/>
</svg>
