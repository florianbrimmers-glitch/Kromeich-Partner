<?xml version="1.0" encoding="UTF-8"?>
<!-- Baustelle Wachturm: schmaler hoher Steinpfeiler im Bau, Geruest
     drumherum. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cw_sL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a39080"/>
      <stop offset="1" stop-color="#766656"/>
    </linearGradient>
    <linearGradient id="cw_sR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6c5e50"/>
      <stop offset="1" stop-color="#403628"/>
    </linearGradient>
    <linearGradient id="cw_beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87238"/>
      <stop offset="1" stop-color="#5c3c18"/>
    </linearGradient>
  </defs>
  <ellipse cx="256" cy="388" rx="130" ry="22" fill="#000" opacity="0.34"/>

  <!-- Stein-Sockel breit -->
  <polygon points="176,310 256,348 336,310 256,272" fill="#5e5246" stroke="#2a2418" stroke-width="2"/>
  <polygon points="176,310 256,348 256,360 176,322" fill="#4a3e32"/>
  <polygon points="256,348 336,310 336,322 256,360" fill="#352a20"/>

  <!-- TURM-PFEILER: schmaler hoher Stein, unebener Top (im Bau) -->
  <polygon points="200,300 256,332 256,156 200,124" fill="url(#cw_sL)" stroke="#2a2418" stroke-width="2.5"/>
  <line x1="200" y1="180" x2="256" y2="212" stroke="#4e4030" stroke-width="1.4" opacity="0.55"/>
  <line x1="200" y1="220" x2="256" y2="252" stroke="#4e4030" stroke-width="1.4" opacity="0.55"/>
  <line x1="200" y1="260" x2="256" y2="292" stroke="#4e4030" stroke-width="1.4" opacity="0.55"/>
  <!-- Unebener oberer Rand -->
  <polygon points="200,124 220,118 232,128 248,116 256,124 252,156 216,140 200,156 Z" fill="url(#cw_sL)"/>

  <polygon points="256,332 312,300 312,124 256,156" fill="url(#cw_sR)" stroke="#1a1610" stroke-width="2.5"/>
  <line x1="256" y1="212" x2="312" y2="180" stroke="#2c241a" stroke-width="1.4" opacity="0.5"/>
  <line x1="256" y1="252" x2="312" y2="220" stroke="#2c241a" stroke-width="1.4" opacity="0.5"/>

  <!-- Geruest am Turm: zwei kraeftige Pfosten + Querbalken -->
  <polygon points="160,300 174,306 174,140 160,134" fill="url(#cw_beam)" stroke="#3a2412" stroke-width="2"/>
  <polygon points="338,260 352,254 352,90 338,84" fill="url(#cw_beam)" stroke="#3a2412" stroke-width="2"/>
  <polygon points="160,140 352,184 352,196 160,152" fill="url(#cw_beam)" stroke="#3a2412" stroke-width="2"/>
  <polygon points="160,180 352,224 352,236 160,192" fill="#7a5230" stroke="#3a2412" stroke-width="1.5"/>

  <!-- Steinhaufen vorne -->
  <ellipse cx="382" cy="372" rx="32" ry="13" fill="#5e5246"/>
  <polygon points="362,366 382,358 402,366 390,374 374,374" fill="#766658"/>
</svg>
