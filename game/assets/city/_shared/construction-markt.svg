<?xml version="1.0" encoding="UTF-8"?>
<!-- Baustelle Markt: niedriger Steinklotz, dazu schon aufgestellte Sonnen-
     segel-Pfosten und Marktstand-Andeutung. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cm_sL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7a772"/>
      <stop offset="1" stop-color="#9a7c4a"/>
    </linearGradient>
    <linearGradient id="cm_sR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6b3e"/>
      <stop offset="1" stop-color="#5a4322"/>
    </linearGradient>
  </defs>
  <ellipse cx="256" cy="388" rx="190" ry="30" fill="#000" opacity="0.32"/>

  <!-- Niedriger Steinklotz -->
  <polygon points="96,320 256,400 256,300 96,220" fill="url(#cm_sL)" stroke="#3a2a18" stroke-width="2.5"/>
  <line x1="130" y1="260" x2="130" y2="354" stroke="#5e4628" stroke-width="1.5" opacity="0.5"/>
  <line x1="180" y1="284" x2="180" y2="378" stroke="#5e4628" stroke-width="1.5" opacity="0.5"/>

  <polygon points="256,400 416,320 416,260 256,300" fill="url(#cm_sR)" stroke="#2a1e10" stroke-width="2.5"/>
  <line x1="312" y1="370" x2="312" y2="280" stroke="#3a2a16" stroke-width="1.5" opacity="0.55"/>
  <line x1="372" y1="346" x2="372" y2="256" stroke="#3a2a16" stroke-width="1.5" opacity="0.55"/>

  <!-- ROT-WEISSES SONNENSEGEL-Stueck (schon befestigt) -->
  <line x1="120" y1="220" x2="120" y2="116" stroke="#3a2a16" stroke-width="3.5"/>
  <line x1="280" y1="300" x2="280" y2="196" stroke="#3a2a16" stroke-width="3.5"/>
  <polygon points="280,196 380,210 380,222 280,208" fill="#c93a2c" opacity="0.85"/>
  <polygon points="120,116 280,196 280,208 120,128" fill="#e6e0c8" opacity="0.9"/>
  <polygon points="120,116 200,156 280,196 200,168 120,128" fill="#c93a2c" opacity="0.55"/>

  <!-- Marktstand vorne mit angefangenen Waren -->
  <polygon points="142,372 212,392 212,360 142,340" fill="#7a5a30"/>
  <polygon points="142,340 212,360 212,352 142,332" fill="#a07a44"/>
  <circle cx="166" cy="354" r="8" fill="#caa472"/>
  <circle cx="186" cy="362" r="7" fill="#a8845c"/>

  <!-- Tongefaess als Marktwaren-Andeutung -->
  <ellipse cx="372" cy="380" rx="16" ry="20" fill="#9a6a3e"/>
  <ellipse cx="372" cy="362" rx="16" ry="7" fill="#6a4824"/>
</svg>
