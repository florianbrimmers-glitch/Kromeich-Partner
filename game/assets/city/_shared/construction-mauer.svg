<?xml version="1.0" encoding="UTF-8"?>
<!-- Baustelle Stadtmauer: niedriges Fundament, gestapelte Steine, Holz-
     geruest, Kelle und Werkzeuge - klares "Wir bauen die Mauer"-Bild. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cmr_sL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a89a88"/>
      <stop offset="1" stop-color="#766658"/>
    </linearGradient>
    <linearGradient id="cmr_sR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#665a4c"/>
      <stop offset="1" stop-color="#3e3528"/>
    </linearGradient>
    <linearGradient id="cmr_beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87238"/>
      <stop offset="1" stop-color="#5c3c18"/>
    </linearGradient>
  </defs>
  <ellipse cx="256" cy="388" rx="200" ry="30" fill="#000" opacity="0.32"/>

  <!-- Fundament-Iso links, mit unebener Oberkante (im Bau) -->
  <path d="M 70,310 L 256,400 L 256,300 L 230,288 L 218,302 L 188,282 L 166,294 L 142,278 L 116,290 L 92,272 L 70,266 Z"
        fill="url(#cmr_sL)" stroke="#3a2c1c" stroke-width="2.5"/>
  <line x1="120" y1="284" x2="120" y2="358" stroke="#3a2c1a" stroke-width="2" opacity="0.65"/>
  <line x1="180" y1="312" x2="180" y2="378" stroke="#3a2c1a" stroke-width="2" opacity="0.65"/>
  <line x1="218" y1="332" x2="218" y2="390" stroke="#3a2c1a" stroke-width="2" opacity="0.65"/>

  <!-- Fundament-Iso rechts, noch niedriger -->
  <path d="M 256,400 L 442,310 L 442,260 L 416,274 L 388,260 L 360,278 L 332,266 L 304,282 L 280,272 L 256,300 Z"
        fill="url(#cmr_sR)" stroke="#241a10" stroke-width="2.5"/>
  <line x1="296" y1="368" x2="296" y2="290" stroke="#241a10" stroke-width="2" opacity="0.65"/>
  <line x1="346" y1="346" x2="346" y2="266" stroke="#241a10" stroke-width="2" opacity="0.65"/>
  <line x1="398" y1="322" x2="398" y2="248" stroke="#241a10" stroke-width="2" opacity="0.65"/>

  <!-- Holzgeruest ueber dem Fundament -->
  <polygon points="76,260 92,266 92,140 76,134" fill="url(#cmr_beam)" stroke="#3a2412" stroke-width="2"/>
  <polygon points="208,300 224,306 224,182 208,176" fill="url(#cmr_beam)" stroke="#3a2412" stroke-width="2"/>
  <polygon points="340,266 356,260 356,134 340,140" fill="url(#cmr_beam)" stroke="#3a2412" stroke-width="2"/>
  <polygon points="76,160 224,200 224,212 76,172" fill="url(#cmr_beam)" stroke="#3a2412" stroke-width="2"/>
  <polygon points="224,200 356,162 356,174 224,212" fill="url(#cmr_beam)" stroke="#3a2412" stroke-width="2"/>

  <!-- Stein-Stapel zum Verbauen vorne -->
  <g>
    <rect x="190" y="370" width="50" height="14" fill="#988878" stroke="#3a2c1c" stroke-width="1"/>
    <rect x="200" y="356" width="50" height="14" fill="#a8988a" stroke="#3a2c1c" stroke-width="1"/>
    <rect x="186" y="384" width="58" height="12" fill="#766658" stroke="#3a2c1c" stroke-width="1"/>
    <line x1="206" y1="370" x2="206" y2="384" stroke="#3a2c1c" stroke-width="1" opacity="0.7"/>
    <line x1="226" y1="370" x2="226" y2="384" stroke="#3a2c1c" stroke-width="1" opacity="0.7"/>
  </g>

  <!-- Werkzeuge: Schubkarre und Kelle vorne rechts -->
  <polygon points="280,386 350,396 350,378 280,368" fill="#8a6230"/>
  <circle  cx="288" cy="394" r="9" fill="#2a1a08" stroke="#0c0604" stroke-width="1.5"/>
  <line x1="346" y1="380" x2="370" y2="370" stroke="#3a2412" stroke-width="4"/>
  <!-- Kelle -->
  <polygon points="380,360 410,372 408,376 378,364" fill="#caa472" stroke="#3a2412" stroke-width="0.8"/>
  <line x1="408" y1="372" x2="424" y2="362" stroke="#3a2412" stroke-width="2"/>
</svg>
