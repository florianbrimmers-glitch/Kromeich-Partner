<?xml version="1.0" encoding="UTF-8"?>
<!-- Baustelle Kaserne: niedrige Steinmauer mit angedeutetem rotem
     Hauptbanner-Ribbon am Geruest. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ck_sL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a89a88"/>
      <stop offset="1" stop-color="#766658"/>
    </linearGradient>
    <linearGradient id="ck_sR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#665a4c"/>
      <stop offset="1" stop-color="#3e3528"/>
    </linearGradient>
    <linearGradient id="ck_beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87238"/>
      <stop offset="1" stop-color="#5c3c18"/>
    </linearGradient>
  </defs>
  <ellipse cx="256" cy="388" rx="190" ry="30" fill="#000" opacity="0.32"/>

  <!-- Steinklotz: linke Wand -->
  <path d="M 96,320 L 256,400 L 256,300 L 232,280 L 220,294 L 188,272 L 164,290 L 138,266 L 116,278 L 96,260 Z"
        fill="url(#ck_sL)" stroke="#3a2c1c" stroke-width="3"/>
  <line x1="148" y1="298" x2="148" y2="370" stroke="#3a2c1a" stroke-width="2" opacity="0.7"/>
  <line x1="200" y1="324" x2="200" y2="385" stroke="#3a2c1a" stroke-width="2" opacity="0.7"/>

  <!-- Rechte Wand, niedriger -->
  <path d="M 256,400 L 416,320 L 416,260 L 384,272 L 360,256 L 332,272 L 308,260 L 280,278 L 256,300 Z"
        fill="url(#ck_sR)" stroke="#241a10" stroke-width="3"/>
  <line x1="300" y1="370" x2="300" y2="280" stroke="#241a10" stroke-width="2" opacity="0.7"/>
  <line x1="356" y1="346" x2="356" y2="256" stroke="#241a10" stroke-width="2" opacity="0.7"/>

  <!-- Geruest -->
  <polygon points="94,256 110,260 110,140 94,134" fill="url(#ck_beam)" stroke="#3a2412" stroke-width="2"/>
  <polygon points="218,300 234,306 234,184 218,178" fill="url(#ck_beam)" stroke="#3a2412" stroke-width="2"/>
  <polygon points="94,160 234,200 234,212 94,172" fill="url(#ck_beam)" stroke="#3a2412" stroke-width="2"/>

  <!-- ROTES BANNER-RIBBON: Vorahnung Kaserne -->
  <rect x="148" y="180" width="38" height="46" fill="#c93a2c" stroke="#5a1410" stroke-width="1.5"/>
  <polygon points="148,226 167,238 186,226" fill="#c93a2c" stroke="#5a1410" stroke-width="1.5"/>
  <line x1="167" y1="194" x2="167" y2="218" stroke="#e6c247" stroke-width="2"/>

  <!-- Schubkarre -->
  <polygon points="262,386 332,396 332,378 262,368" fill="#8a6230"/>
  <circle cx="270" cy="394" r="9" fill="#2a1a08" stroke="#0c0604" stroke-width="1.5"/>
  <line x1="328" y1="380" x2="356" y2="370" stroke="#3a2412" stroke-width="4"/>

  <!-- Steinhaufen -->
  <ellipse cx="402" cy="372" rx="32" ry="13" fill="#5e5246"/>
  <polygon points="382,366 402,358 422,366 410,374 392,374" fill="#766658"/>
</svg>
