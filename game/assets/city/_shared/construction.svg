<?xml version="1.0" encoding="UTF-8"?>
<!-- Baustelle (fraktions-neutral). Iteration 2: gross-flaechiger, weil
     die feinen Linien der ersten Version bei realer Render-Groesse
     verschwammen und der Klotz dann wie ein Karton wirkte. Jetzt:
     deutlich erkennbares Holzgeruest mit dickem Querbalken, halbfertiger
     Steinblock mit unebener Kante, gross genug fuer Phone-Display. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cn_stoneL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a89a88"/>
      <stop offset="1" stop-color="#766658"/>
    </linearGradient>
    <linearGradient id="cn_stoneR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#665a4c"/>
      <stop offset="1" stop-color="#3e3528"/>
    </linearGradient>
    <linearGradient id="cn_beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87238"/>
      <stop offset="1" stop-color="#5c3c18"/>
    </linearGradient>
  </defs>

  <!-- Boden-Schatten -->
  <ellipse cx="256" cy="388" rx="190" ry="30" fill="#000" opacity="0.32"/>

  <!-- Linke Wand des halben Steinklotzes (unebene Oberkante) -->
  <path d="M 96,320 L 256,400 L 256,300 L 232,280 L 220,294 L 188,272 L 164,290 L 138,266 L 116,278 L 96,260 Z"
        fill="url(#cn_stoneL)" stroke="#3a2c1c" stroke-width="3"/>
  <!-- Steinblock-Fugen, kraeftiger -->
  <line x1="148" y1="298" x2="148" y2="370" stroke="#3a2c1a" stroke-width="2" opacity="0.7"/>
  <line x1="200" y1="324" x2="200" y2="385" stroke="#3a2c1a" stroke-width="2" opacity="0.7"/>
  <line x1="120" y1="320" x2="232" y2="376" stroke="#3a2c1a" stroke-width="2" opacity="0.5"/>

  <!-- Rechte Wand, niedriger (noch im Bau) -->
  <path d="M 256,400 L 416,320 L 416,260 L 384,272 L 360,256 L 332,272 L 308,260 L 280,278 L 256,300 Z"
        fill="url(#cn_stoneR)" stroke="#241a10" stroke-width="3"/>
  <line x1="300" y1="370" x2="300" y2="280" stroke="#241a10" stroke-width="2" opacity="0.7"/>
  <line x1="356" y1="346" x2="356" y2="256" stroke="#241a10" stroke-width="2" opacity="0.7"/>

  <!-- Grosses Holzgeruest, zwei dicke vertikale Pfosten plus diagonaler Strebebalken -->
  <polygon points="94,256 110,260 110,140 94,134" fill="url(#cn_beam)" stroke="#3a2412" stroke-width="2"/>
  <polygon points="218,300 234,306 234,184 218,178" fill="url(#cn_beam)" stroke="#3a2412" stroke-width="2"/>
  <!-- Horizontaler Querbalken zwischen den Pfosten -->
  <polygon points="94,160 234,200 234,212 94,172" fill="url(#cn_beam)" stroke="#3a2412" stroke-width="2"/>
  <!-- Diagonale Strebe -->
  <polygon points="94,200 234,250 234,260 94,210" fill="#7a5230" stroke="#3a2412" stroke-width="1.5"/>

  <!-- Auf dem Gerueststeg liegt ein Werkzeug-Kasten oder Sack -->
  <polygon points="138,160 198,180 198,164 138,144" fill="#7a4a22"/>
  <polygon points="138,144 198,164 198,156 138,136" fill="#a07238"/>

  <!-- Schubkarre vorne in der Mitte -->
  <polygon points="262,386 332,396 332,378 262,368" fill="#8a6230"/>
  <polygon points="262,368 332,378 332,372 262,362" fill="#a87a40"/>
  <circle cx="270" cy="394" r="9" fill="#2a1a08" stroke="#0c0604" stroke-width="1.5"/>
  <line x1="328" y1="380" x2="356" y2="370" stroke="#3a2412" stroke-width="4"/>

  <!-- Steinhaufen rechts vorne -->
  <ellipse cx="402" cy="372" rx="36" ry="14" fill="#5e5246"/>
  <polygon points="378,366 402,358 426,366 414,376 390,376" fill="#766658"/>
  <polygon points="386,360 402,352 418,360 410,366 394,366" fill="#988878"/>
  <polygon points="394,354 402,348 410,354 406,358 398,358" fill="#aa9a86"/>

  <!-- Halbhoher Holzbalken liegt schraeg im Vordergrund (deutet "im Bau" an) -->
  <polygon points="172,388 268,400 396,330 304,318" fill="#8a5e26" stroke="#3a2412" stroke-width="1.5"/>
  <polygon points="172,388 268,400 268,394 172,382" fill="#5c3c18"/>
</svg>
