name: Daily Contact Import

on:
  schedule:
    # Täglich um 1:00 UTC = 3:00 MESZ / 2:00 MEZ, auch am Wochenende: Der Lauf liest
    # die letzten 48 h (SCAN_HOURS). Bis 19.11.2026 lief er Mo-Fr mit 24 h – der
    # Freitag wurde nie gelesen, und jede Verspätung des Starts riss eine Lücke.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no contacts created)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      apollo:
        description: "Apollo-Anreicherung in diesem Lauf (zum Testen des Schlüssels: true + dry_run true)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      scan_hours:
        description: "Wie viele Stunden zurück lesen (Standard 48; zum Nachholen z. B. 168)"
        required: false
        default: "48"

# Nie zwei Läufe gleichzeitig (manueller Lauf neben dem verspäteten Cron):
# beide würden dieselben Kontakte anlegen.
concurrency:
  group: contact-import
  cancel-in-progress: false

jobs:
  import-contacts:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run contact import pipeline
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_REFRESH_TOKEN_2: ${{ secrets.GOOGLE_REFRESH_TOKEN_2 }}
          GOOGLE_REFRESH_TOKEN_3: ${{ secrets.GOOGLE_REFRESH_TOKEN_3 }}
          GOOGLE_REFRESH_TOKEN_4: ${{ secrets.GOOGLE_REFRESH_TOKEN_4 }}
          GOOGLE_REFRESH_TOKEN_5: ${{ secrets.GOOGLE_REFRESH_TOKEN_5 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          # Apollo ist aus, bis der Schlüssel wieder angenommen wird (19.11.2026: 401 bei jedem
          # Aufruf). Einschalten: Repository-Variable APOLLO_ENABLED=true anlegen
          # (Settings → Secrets and variables → Actions → Variables). Testen ohne Folgen:
          # diesen Workflow von Hand starten mit dry_run=true und apollo=true – der Lauf prüft
          # den Schlüssel gleich am Anfang und meldet, ob Apollo ihn annimmt.
          APOLLO_ENABLED: ${{ github.event.inputs.apollo || vars.APOLLO_ENABLED || 'false' }}
          PROPSTACK_API_KEY: ${{ secrets.PROPSTACK_API_KEY }}
          PROPSTACK_API_V2_CONTACTS: ${{ secrets.PROPSTACK_API_V2_CONTACTS }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SCAN_HOURS: ${{ github.event.inputs.scan_hours || '48' }}
        run: python -m src.main
