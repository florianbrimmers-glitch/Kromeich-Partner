name: Diagnose Verdion Match

# TEMP: einmalige Verifikation des domänen-gestützten KI-Matchings (wird zurückgebaut)
on:
  push:
    branches: [claude/objekte-slack-propstack-handler-4vj23n]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Run diagnose
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROPSTACK_API_KEY: ${{ secrets.PROPSTACK_API_KEY }}
        run: python -m scripts.diagnose_verdion_match
