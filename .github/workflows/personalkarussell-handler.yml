name: Personalkarussell Handler

on:
  schedule:
    # Täglich um 03:45 UTC (nach objekte 02:00, newsletter 03:00, events 03:30)
    - cron: "45 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (alles läuft als Stufe B / Review-Aufgabe)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      no_write:
        description: "Nur lesen/loggen – keine Reactions, keine Aufgaben, keine Writes"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      scan_from_hours:
        description: "Scan-Fenster: Stunden zurück (Standard 26)"
        required: false
        default: "26"
      scan_to_hours:
        description: "Bis Stunden zurück (0 = bis jetzt)"
        required: false
        default: "0"

concurrency:
  group: personalkarussell-handler
  cancel-in-progress: false

jobs:
  personalkarussell-handler:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run personalkarussell handler
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROPSTACK_API_KEY: ${{ secrets.PROPSTACK_API_KEY }}
          PROPSTACK_API_V2_CONTACTS: ${{ secrets.PROPSTACK_API_V2_CONTACTS }}
          # Testbetrieb: alles als Review-Aufgabe. Nach einigen plausiblen Nächten auf 'false' stellen.
          DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
          NO_WRITE: ${{ github.event.inputs.no_write || 'false' }}
          SCAN_HOURS: ${{ github.event.inputs.scan_from_hours || '26' }}
          SCAN_LATEST_HOURS: ${{ github.event.inputs.scan_to_hours || '0' }}
          # Entscheidungslog bleibt lokal auf dem Runner (kein Artefakt, siehe andere Handler)
          DECISION_LOG_PATH: personalkarussell_decisions.jsonl
        run: python -m personalkarussell_handler.main
