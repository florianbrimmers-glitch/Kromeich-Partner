name: Propstack Abgleich (OSM Logistikhallen)

on:
  workflow_dispatch:

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests

      - name: Run Propstack match
        env:
          PROPSTACK_API_KEY: ${{ secrets.PROPSTACK_API_KEY }}
        run: python3 scripts/match_propstack.py | tee propstack_match_result.txt

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: propstack-match-result
          path: propstack_match_result.txt
