name: Propstack Abgleich (OSM Logistikhallen)

on:
  workflow_dispatch:

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests

      - name: Run Propstack match
        env:
          PROPSTACK_API_KEY: ${{ secrets.PROPSTACK_API_KEY }}
        run: python3 scripts/match_propstack.py | tee propstack_match_result.txt

      - name: Detail der Nachbar-Kandidaten
        env:
          PROPSTACK_API_KEY: ${{ secrets.PROPSTACK_API_KEY }}
        run: python3 scripts/fetch_propstack_units.py 2778398 5032898 2777954

      - name: Propstack-Objekte (Gewerbe, Region)
        env:
          PROPSTACK_API_KEY: ${{ secrets.PROPSTACK_API_KEY }}
          REGION_RADIUS_KM: "80"
          ONLY_COMMERCIAL: "1"
        run: python3 scripts/list_propstack_objects.py

      - name: Upload result
        if: always()
        continue-on-error: true   # Artifact-Quota darf den Run nicht rot machen
        uses: actions/upload-artifact@v7
        with:
          name: propstack-match-result
          path: propstack_match_result.txt
