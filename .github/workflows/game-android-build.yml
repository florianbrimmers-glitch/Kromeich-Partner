name: Android APK Build

# Trigger:
# - workflow_dispatch: manueller Start ueber GitHub-UI. Funktioniert nur
#   wenn die Workflow-Datei auf dem Default-Branch (main) liegt. Solange
#   das noch nicht der Fall ist, laeuft der Build via push-Trigger unten.
# - push: bei jedem Push auf die aktive Feature-Branch, begrenzt auf
#   aenderungen im game/ Verzeichnis oder am Workflow selbst, damit
#   nicht jeder Kontakt-Import-Commit den Android-Build kostet.
# (retrigger marker)
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'debug oder release'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - 'claude/heroes-mobile-game-**'
    paths:
      - 'game/**'
      - '.github/workflows/game-android-build.yml'

env:
  GODOT_VERSION: 4.3
  GODOT_STATUS: stable

jobs:
  android-apk:
    name: Godot -> APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Install Android build tools
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Godot 4.2 braucht net6.0 (default) fuer Standalone und net7.0
          # fuer Android/iOS-Export (Mono-Export-Template). Wir installieren
          # beide + net8 fuer Forward-Compat. setup-dotnet@v4 akzeptiert
          # multi-line dotnet-version.
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x

      - name: Download Godot headless (Mono)
        run: |
          curl -L -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_mono_linux_x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_mono_linux_x86_64" godot-mono
          ln -s "godot-mono/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_mono_linux.x86_64" godot

      - name: Download Godot export templates (Mono)
        run: |
          curl -L -o templates.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_mono_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.zip -d ./templates-extracted
          mv ./templates-extracted/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}.mono

      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore ~/.android/debug.keystore \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -deststoretype pkcs12

      - name: Configure Godot Editor settings for Android
        run: |
          mkdir -p ~/.config/godot
          # Wichtig: export/android/java_sdk_path muss auf JAVA_HOME zeigen,
          # das setup-java v4 per env gesetzt hat. Der Debug-Keystore wird
          # vom vorigen Step in ~/.android/debug.keystore abgelegt.
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project (headless)
        working-directory: game
        run: |
          # Erster Import initialisiert .godot/ und .godot/mono/
          ../godot --headless --import || true
          ../godot --headless --import

      - name: Restore NuGet packages
        working-directory: game
        run: |
          # Godot 4.x ruft `dotnet publish` selbst beim Export auf. Wir
          # restoren hier vorher, damit die Export-Phase nicht erst NuGet
          # kontaktieren muss (und wir sehen NuGet-Fehler frueher).
          dotnet restore

      - name: Install Android build template (Custom Build, benoetigt fuer C#)
        working-directory: game
        timeout-minutes: 3
        run: |
          # Godot 4.x --install-android-build-template haengt im headless-
          # Modus (bekannter Bug). Workaround: das android_source.zip aus
          # den Export-Templates selbst nach android/build/ entpacken - das
          # ist exakt, was der Command sonst macht.
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}.mono"
          ls -la "$TEMPLATE_DIR"
          mkdir -p android/build
          unzip -q -o "$TEMPLATE_DIR/android_source.zip" -d android/build/
          # .gdignore markiert den Ordner als nicht-import-bar fuer Godot,
          # sonst versucht der Editor die Gradle-Quellen als Assets zu importieren.
          touch android/build/.gdignore
          # .build_version enthaelt VERSION_FULL_CONFIG (z.B. 4.3.stable.mono).
          # Ohne diese Datei bricht der Export mit "no version info for it exists" ab.
          # Godot's --install-android-build-template schreibt sie normalerweise selbst.
          echo "${GODOT_VERSION}.${GODOT_STATUS}.mono" > android/.build_version
          ls -la android/build/ | head -10
          cat android/.build_version

      - name: Export Android APK
        working-directory: game
        timeout-minutes: 15
        env:
          # Auf push-Events ist inputs.build_type leer -> default debug.
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
        run: |
          mkdir -p build
          if [ "$BUILD_TYPE" = "release" ]; then
            ../godot --headless --export-release "Android" build/KromeichHeroes.apk
          else
            ../godot --headless --export-debug "Android" build/KromeichHeroes.apk
          fi
          ls -la build/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KromeichHeroes-${{ github.event.inputs.build_type || 'debug' }}-${{ github.sha }}
          path: game/build/*.apk
          retention-days: 14

      - name: Upload Godot logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-logs-${{ github.sha }}
          path: |
            ~/.local/share/godot/app_userdata/**/logs/
            game/.godot/mono/build_logs/
          retention-days: 7
