name: Propstack MCP – Deploy

# Veröffentlicht den Worker nach jedem Merge auf main (nur bei Änderungen in propstack-mcp/).
# Benötigt die Repository-Secrets CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID.
# Die Worker-Secrets (Google, Propstack, Cookie-Key) bleiben in Cloudflare und werden
# hier nicht gebraucht – ein Deployment löscht sie nicht.

on:
  push:
    branches: [main]
    paths: ["propstack-mcp/**", ".github/workflows/propstack-mcp-deploy.yml"]
  workflow_dispatch:

concurrency:
  group: propstack-mcp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: propstack-mcp
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Secrets vorhanden?
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID fehlen – Deployment übersprungen (siehe propstack-mcp/README.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node 24
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: propstack-mcp/package-lock.json

      - name: Install dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci

      - name: Type-check und Tests
        if: steps.secrets.outputs.ready == 'true'
        run: npm run type-check && npm test

      - name: D1-Migrationen anwenden
        if: steps.secrets.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply AUDIT_DB --remote

      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        run: npx wrangler deploy

      - name: Smoke-Test (ohne Token muss 401 kommen)
        if: steps.secrets.outputs.ready == 'true'
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST https://propstack-mcp.kromeichpartner.workers.dev/mcp)
          echo "POST /mcp ohne Token → $status"
          test "$status" = "401"
