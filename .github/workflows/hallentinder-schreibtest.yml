name: Hallentinder Schreibtest

# Verifiziert das Payload-Schema der Deal-Anlage (POST /client_properties)
# gegen die Live-API. Modus "ja" legt einen markierten Testkontakt plus Deals
# an; Modus "pruefen" legt nichts an, sondern räumt Datensätze eines früheren
# Laufs nach.
#
# ACHTUNG: Modus "ja" schreibt in das Produktiv-CRM. Deals lassen sich per API
# NICHT wieder löschen (DELETE liefert 404) – sie verschwinden nur, wenn der
# zugehörige Kontakt gelöscht wird, und auch das nicht zuverlässig. Nur
# starten, wenn das Schema wirklich neu geprüft werden muss.
on:
  workflow_dispatch:
    inputs:
      modus:
        description: "ja = anlegen und prüfen (schreibt!), pruefen = nur nachräumen"
        required: true
        default: "pruefen"
        type: choice
        options:
          - "pruefen"
          - "ja"
      altlasten:
        description: "Nachzuräumende Deals als 'deal_id:property_id,…'"
        required: false
        default: ""
      altkontakt:
        description: "Zu prüfende Kontakt-ID aus einem früheren Lauf"
        required: false
        default: ""

concurrency:
  group: hallentinder-schreibtest
  cancel-in-progress: false

jobs:
  schreibtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Schreibtest gegen Propstack
        env:
          PROPSTACK_API_KEY: ${{ secrets.PROPSTACK_API_KEY }}
          PROPSTACK_KEY_OBJEKTE: ${{ secrets.PROPSTACK_KEY_OBJEKTE }}
          HALLENTINDER_SCHREIBTEST: ${{ github.event.inputs.modus }}
          HALLENTINDER_ALTLASTEN: ${{ github.event.inputs.altlasten }}
          HALLENTINDER_ALTKONTAKT: ${{ github.event.inputs.altkontakt }}
          NO_WRITE: "false"
        run: python -m hallentinder.schreibtest | tee hallentinder_schreibtest.txt

      - name: Upload Bericht
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hallentinder-schreibtest-${{ github.run_id }}
          path: hallentinder_schreibtest.txt
          if-no-files-found: ignore
