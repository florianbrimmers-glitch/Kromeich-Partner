name: Diagnose Asana Write

# TEMP: einmalige Verifikation des Asana-Schreibwegs (wird zurückgebaut)
on:
  push:
    branches: [claude/events-asana]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Run diagnose
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
        run: python -m scripts.diagnose_asana_write
