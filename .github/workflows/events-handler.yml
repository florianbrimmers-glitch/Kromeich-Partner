name: Events Handler

on:
  schedule:
    # Täglich um 03:30 UTC (nach objekte 02:00 und newsletter 03:00)
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (Events erkennen/loggen, aber NICHT in Asana anlegen)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      no_write:
        description: "Nur lesen/loggen – keine Reactions, keine Asana-Writes"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      scan_from_hours:
        description: "Scan-Fenster: Stunden zurück (Standard 27)"
        required: false
        default: "27"
      scan_to_hours:
        description: "Bis Stunden zurück (0 = bis jetzt)"
        required: false
        default: "0"

concurrency:
  group: events-handler
  cancel-in-progress: false

jobs:
  events-handler:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run events handler
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Asana-Schreibzugriff (Personal Access Token). Für DRY_RUN/NO_WRITE nicht nötig.
          # Mehrere Namen durchgereicht – der erste gefüllte gewinnt (nicht vorhandene
          # Secrets sind leer). So funktioniert es unabhängig davon, wie das Secret heißt.
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          ASANA_TOKEN: ${{ secrets.ASANA_TOKEN }}
          ASANA_PAT: ${{ secrets.ASANA_PAT }}
          ASANA_API_KEY: ${{ secrets.ASANA_API_KEY }}
          ASANA_API_TOKEN: ${{ secrets.ASANA_API_TOKEN }}
          ASANA_PERSONAL_ACCESS_TOKEN: ${{ secrets.ASANA_PERSONAL_ACCESS_TOKEN }}
          # Scharf: Cron legt erkannte Events als Asana-Aufgaben an (vom User am 28.07. bestätigt,
          # nachdem drei Dry-Run-Nächte inkl. eines realen Falls korrekt ausgewertet wurden).
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          NO_WRITE: ${{ github.event.inputs.no_write || 'false' }}
          SCAN_HOURS: ${{ github.event.inputs.scan_from_hours || '27' }}
          SCAN_LATEST_HOURS: ${{ github.event.inputs.scan_to_hours || '0' }}
          # Entscheidungslog bleibt lokal auf dem Runner: bewusst kein Artefakt,
          # das füllte nur die Quota und meldete grüne Läufe rot.
          DECISION_LOG_PATH: events_decisions.jsonl
        run: python -m events_handler.main
