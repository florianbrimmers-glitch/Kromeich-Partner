name: Comparables Report

on:
  schedule:
    # Quartalsweise am 1. Januar/April/Juli/Oktober um 05:00 UTC
    # (nach objekte 02:00, newsletter 03:00, events 03:30).
    # Mieten bewegen sich nicht monatlich – ein Quartal ist der Takt, in dem
    # sich der Median überhaupt sichtbar ändert.
    - cron: "0 5 1 1,4,7,10 *"
  # ACHTUNG: workflow_dispatch greift erst, wenn diese Datei auf dem
  # Default-Branch liegt – vorher antwortet die API mit 404. Für Läufe vom
  # Feature-Branch aus wurde vorübergehend ein push-Trigger genutzt
  # (Läufe 31700073360 und 31700822006, 13.08.2026).
  workflow_dispatch:
    inputs:
      quelle:
        description: "Datenquelle"
        required: false
        default: "propstack"
        type: choice
        options:
          - "propstack"
          - "beide"
          - "drive"
      dry_run:
        description: "Dry run (Report bauen und loggen, aber NICHT in Slack posten)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      no_write:
        description: "Nur lesen/loggen – kein Slack-Post"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      make_pdf:
        description: "K&P-PDF erzeugen (für Kundengespräche)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      asana_upload:
        description: "Quartalsbericht als Unteraufgabe in Asana ablegen (mit PDFs im Anhang)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      max_documents:
        description: "Kostenbremse: max. Dokumente (0 = alle)"
        required: false
        default: "0"
      channel:
        description: "Slack-Kanal-ID (leer = Standard #objekte)"
        required: false
        default: ""

concurrency:
  group: comparables-report
  cancel-in-progress: false

# contents: write nur für das Fortschreiben der Zeitreihe
# (comparables_snapshots.json) – der Handler selbst liest ausschließlich.
permissions:
  contents: write

jobs:
  comparables-report:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Der Extraktions-Cache (fileId+modifiedTime -> Extraktion) spart die
      # Claude-Calls für unveränderte Angebote über die Monate hinweg.
      - name: Restore extraction cache
        uses: actions/cache@v4
        with:
          path: comparables_cache.jsonl
          key: comparables-cache-${{ github.run_id }}
          restore-keys: |
            comparables-cache-

      - name: Run comparables report
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Primärquelle: die in Propstack gepflegten Mieten
          PROPSTACK_API_KEY: ${{ secrets.PROPSTACK_API_KEY }}
          PROPSTACK_KEY_OBJEKTE: ${{ secrets.PROPSTACK_KEY_OBJEKTE }}
          QUELLE: ${{ github.event.inputs.quelle || 'propstack' }}
          # Drive nur nötig, wenn QUELLE drive/beide ist
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # Drive braucht den Scope drive.readonly. Die bestehenden
          # GOOGLE_REFRESH_TOKEN* sind auf gmail.readonly ausgestellt und
          # reichen NICHT – deshalb ein eigenes Secret, mit Fallback.
          GOOGLE_REFRESH_TOKEN_DRIVE: ${{ secrets.GOOGLE_REFRESH_TOKEN_DRIVE }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          # Noch NICHT scharf: der Cron läuft bewusst im Dry-Run, bis der
          # erste Report inhaltlich abgenommen und der Zielkanal bestätigt
          # ist (siehe comparables_handler/README.md, "Scharfschalten").
          DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
          NO_WRITE: ${{ github.event.inputs.no_write || 'false' }}
          MAKE_PDF: ${{ github.event.inputs.make_pdf || 'true' }}
          # Asana: eine Oberaufgabe "Vergleichsmieten – Quartalsberichte" in
          # 03. (VER) Vermietung / Leasingpaket, darunter je Lauf eine
          # Unteraufgabe mit beiden PDFs im Anhang. Der MCP-Connector kann
          # keine Dateien anhängen – der Upload braucht diesen PAT, dasselbe
          # Secret wie im events_handler.
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          ASANA_TOKEN: ${{ secrets.ASANA_TOKEN }}
          ASANA_PAT: ${{ secrets.ASANA_PAT }}
          ASANA_API_KEY: ${{ secrets.ASANA_API_KEY }}
          ASANA_API_TOKEN: ${{ secrets.ASANA_API_TOKEN }}
          ASANA_PERSONAL_ACCESS_TOKEN: ${{ secrets.ASANA_PERSONAL_ACCESS_TOKEN }}
          ASANA_UPLOAD: ${{ github.event.inputs.asana_upload || 'true' }}
          MAX_DOCUMENTS: ${{ github.event.inputs.max_documents || '0' }}
          COMPARABLES_CHANNEL: ${{ github.event.inputs.channel }}
          DECISION_LOG_PATH: comparables_decisions.jsonl
          DATASET_PATH: comparables_dataset.csv
          EXTRACTION_CACHE_PATH: comparables_cache.jsonl
          SNAPSHOT_PATH: comparables_snapshots.json
          PDF_PATH: comparables_report.pdf
        run: python -m comparables_handler.main

      # Die Zeitreihe der Monats-Mediane ist die einzige Grundlage der
      # Veränderungsspalte – Propstack führt keine Miethistorie. Sie wird
      # deshalb ins Repository zurückgeschrieben und nicht bloß gecacht.
      - name: Zeitreihe fortschreiben
        if: github.ref == 'refs/heads/main' && github.event.inputs.no_write != 'true'
        run: |
          if git diff --quiet -- comparables_snapshots.json; then
            echo "Keine Änderung an der Zeitreihe."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add comparables_snapshots.json
          git commit -m "chore(comparables): Quartals-Snapshot der Mietmediane"
          for versuch in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push-Versuch $versuch fehlgeschlagen, neuer Versuch …"
            sleep $((2 ** versuch))
          done
          exit 1

      - name: Upload comparables dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparables-${{ github.run_id }}
          path: |
            comparables_dataset.csv
            comparables_report.pdf
            comparables_decisions.jsonl
            comparables_snapshots.json
          if-no-files-found: ignore
          retention-days: 90
