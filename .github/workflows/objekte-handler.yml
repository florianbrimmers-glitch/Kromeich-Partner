name: Objekte Handler

on:
  schedule:
    # Täglich nachts um 02:00 UTC (nach Email-Import 01:00 und Visitenkarten 01:30)
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (alles läuft als Stufe B)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      no_write:
        description: "Nur lesen/loggen – keine Reactions, keine Tasks, keine Writes"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      scan_from_hours:
        description: "Scan-Fenster: Stunden zurück (Standard 50; zum Nachholen größer)"
        required: false
        default: "50"
      scan_to_hours:
        description: "Bis Stunden zurück (0 = bis jetzt)"
        required: false
        default: "0"
      thread_lookback_hours:
        description: "Thread-Discovery-Fenster in Stunden"
        required: false
        default: "96"
      objekt_anlage:
        description: "Exposés/„bitte anlegen“ über den Propstack-Connector anlegen (leer = Repo-Variable OBJEKT_ANLAGE)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - "true"
          - "false"
      nur_ts:
        description: "Probelauf: nur diese eine Slack-Nachricht (ts, z. B. 1795600175.387459)"
        required: false
        default: ""

concurrency:
  group: objekte-handler
  cancel-in-progress: false

jobs:
  objekte-handler:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run objekte handler
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROPSTACK_API_KEY: ${{ secrets.PROPSTACK_API_KEY }}
          # Scharf geschaltet: Cron läuft mit Stufe A + B. Manuelle Läufe defaulten weiter auf Dry-Run.
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          NO_WRITE: ${{ github.event.inputs.no_write || 'false' }}
          # 50 h bei täglichem Lauf: Jede Nachricht wird zweimal gesehen. Was verarbeitet ist,
          # trägt das eigene ✅ und wird übersprungen; was gescheitert ist (roter Lauf), holt
          # der nächste Lauf von selbst nach. Mit 26 h war eine gescheiterte Nachricht am
          # Folgetag schon aus dem Fenster.
          SCAN_HOURS: ${{ github.event.inputs.scan_from_hours || '50' }}
          SCAN_LATEST_HOURS: ${{ github.event.inputs.scan_to_hours || '0' }}
          THREAD_LOOKBACK_HOURS: ${{ github.event.inputs.thread_lookback_hours || '96' }}
          # Anlage über den Connector (objekte_handler/anlage.py). Ein über die Repo-Variable
          # OBJEKT_ANLAGE, für einen Probelauf über das Eingabefeld. Ohne das Secret
          # PROPSTACK_MCP_SERVICE_SECRET endet eine Anlage mit Fehler (Lauf rot), nie still.
          OBJEKT_ANLAGE: ${{ github.event.inputs.objekt_anlage || vars.OBJEKT_ANLAGE || 'false' }}
          PROPSTACK_MCP_SERVICE_SECRET: ${{ secrets.PROPSTACK_MCP_SERVICE_SECRET }}
          NUR_TS: ${{ github.event.inputs.nur_ts || '' }}
          # Entscheidungslog bleibt lokal auf dem Runner: bewusst kein Artefakt,
          # das füllte nur die Quota und meldete grüne Läufe rot.
          DECISION_LOG_PATH: objekte_decisions.jsonl
        run: python -m objekte_handler.main
