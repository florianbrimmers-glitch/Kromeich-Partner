name: Propstack MCP

on:
  push:
    branches: [main]
    paths: ["propstack-mcp/**", ".github/workflows/propstack-mcp.yml"]
  pull_request:
    paths: ["propstack-mcp/**", ".github/workflows/propstack-mcp.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: propstack-mcp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: propstack-mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Unit-Tests
        run: npm test
