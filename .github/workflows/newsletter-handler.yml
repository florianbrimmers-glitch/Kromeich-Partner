name: Newsletter Handler

on:
  push:
    # TEMP: zweiter NO_WRITE-Testlauf (Fix-Verifikation), wird zurückgebaut
    branches: [claude/objekte-slack-propstack-handler-4vj23n]
  schedule:
    # Täglich um 03:00 UTC (nach dem ~22:18-CEST-Digest des Vortags und nach objekte 02:00)
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (Vermietungen laufen als Stufe B)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      no_write:
        description: "Nur lesen/loggen – keine Reactions, keine Tasks, keine Writes"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      scan_from_hours:
        description: "Scan-Fenster: Stunden zurück (Standard 27)"
        required: false
        default: "27"
      scan_to_hours:
        description: "Bis Stunden zurück (0 = bis jetzt)"
        required: false
        default: "0"

concurrency:
  group: newsletter-handler
  cancel-in-progress: false

jobs:
  newsletter-handler:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run newsletter handler
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROPSTACK_API_KEY: ${{ secrets.PROPSTACK_API_KEY }}
          # Start im Dry-Run: Cron läuft vorerst mit DRY_RUN=true (nur Review-Aufgaben).
          # Scharfschalten nach Auswertung der ersten Läufe: 'true' -> 'false'.
          DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
          # TEMP: Push-Testlauf erzwingt reinen Lese-/Loglauf + breites Fenster (wird zurückgebaut)
          NO_WRITE: ${{ github.event.inputs.no_write || 'true' }}
          SCAN_HOURS: ${{ github.event.inputs.scan_from_hours || '168' }}
          SCAN_LATEST_HOURS: ${{ github.event.inputs.scan_to_hours || '0' }}
          DECISION_LOG_PATH: newsletter_decisions.jsonl
        run: python -m newsletter_handler.main

      - name: Upload decision log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-decisions-${{ github.run_id }}
          path: newsletter_decisions.jsonl
          if-no-files-found: ignore
          retention-days: 30
