name: Newsletter Handler

on:
  schedule:
    # Täglich um 03:00 UTC (nach dem ~22:18-CEST-Digest des Vortags und nach objekte 02:00)
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (Vermietungen laufen als Stufe B)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      no_write:
        description: "Nur lesen/loggen – keine Reactions, keine Tasks, keine Writes"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      scan_from_hours:
        description: "Scan-Fenster: Stunden zurück (Standard 27)"
        required: false
        default: "27"
      scan_to_hours:
        description: "Bis Stunden zurück (0 = bis jetzt)"
        required: false
        default: "0"

concurrency:
  group: newsletter-handler
  cancel-in-progress: false

jobs:
  newsletter-handler:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run newsletter handler
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROPSTACK_API_KEY: ${{ secrets.PROPSTACK_API_KEY }}
          # DRY_RUN=true ist der gewählte Dauerbetrieb, kein offener Testlauf:
          # Vermietungen gehen immer als Review-Aufgabe an einen Menschen, der
          # Handler setzt nie selbst 'rented'. Auswertung der Läufe 68-74:
          # von 13 Vermietungen waren nur 2 eindeutig gematcht (6x mehrdeutig,
          # 5x nicht im Bestand). Scharf würde also ~2 Handgriffe je 2 Wochen
          # sparen - zu wenig gegen das Risiko, bei einem falschen Treffer
          # eigenständig eine Fläche auf vermietet zu setzen und offene Deals
          # abzusagen. Umstellen nur nach bewusster Entscheidung, nicht als
          # vermeintlich überfälliger nächster Schritt.
          DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
          NO_WRITE: ${{ github.event.inputs.no_write || 'false' }}
          SCAN_HOURS: ${{ github.event.inputs.scan_from_hours || '27' }}
          SCAN_LATEST_HOURS: ${{ github.event.inputs.scan_to_hours || '0' }}
          # Entscheidungslog bleibt lokal auf dem Runner: bewusst kein Artefakt,
          # das füllte nur die Quota und meldete grüne Läufe rot.
          DECISION_LOG_PATH: newsletter_decisions.jsonl
        run: python -m newsletter_handler.main
