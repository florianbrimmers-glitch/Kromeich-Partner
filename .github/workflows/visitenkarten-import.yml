name: Visitenkarten Import

on:
  schedule:
    # Mo-Fr um 01:30 UTC (kurz nach dem Email-Job)
    - cron: "30 1 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no contacts created)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      scan_from_days:
        description: "Untere Grenze: wie viele Tage zurück (Standard: 1)"
        required: false
        default: "1"
      scan_to_days:
        description: "Obere Grenze: bis wie viele Tage zurück (0 = bis jetzt). Für Etappen z.B. von=150, bis=120"
        required: false
        default: "0"

jobs:
  import-visitenkarten:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run visitenkarten import pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          PROPSTACK_API_KEY: ${{ secrets.PROPSTACK_API_KEY }}
          PROPSTACK_API_V2_CONTACTS: ${{ secrets.PROPSTACK_API_V2_CONTACTS }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          FROM_DAYS="${{ github.event.inputs.scan_from_days || '1' }}"
          TO_DAYS="${{ github.event.inputs.scan_to_days || '0' }}"
          export SCAN_HOURS=$(( FROM_DAYS * 24 ))
          export SCAN_LATEST_HOURS=$(( TO_DAYS * 24 ))
          echo "Scanne von ${FROM_DAYS}d bis ${TO_DAYS}d zurück (SCAN_HOURS=$SCAN_HOURS, SCAN_LATEST_HOURS=$SCAN_LATEST_HOURS)"
          python -m src.slack_import
