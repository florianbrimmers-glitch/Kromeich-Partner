name: Visitenkarten Import

on:
  schedule:
    # Mo-Fr um 01:30 UTC (kurz nach dem Email-Job)
    - cron: "30 1 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no contacts created)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      scan_hours:
        description: "Stunden zurück scannen (Standard: 24, für alles: 8760)"
        required: false
        default: "24"

jobs:
  import-visitenkarten:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run visitenkarten import pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          PROPSTACK_API_KEY: ${{ secrets.PROPSTACK_API_KEY }}
          PROPSTACK_API_V2_CONTACTS: ${{ secrets.PROPSTACK_API_V2_CONTACTS }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SCAN_HOURS: ${{ github.event.inputs.scan_hours || '24' }}
        run: python -m src.slack_import
